<html lang="en">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Holiday Planner 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBy7k2Qfb0c4ddRUePiwDX0r8FmineLfao",
    authDomain: "holiday-planner-2026.firebaseapp.com",
    databaseURL: "https://holiday-planner-2026-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "holiday-planner-2026",
    storageBucket: "holiday-planner-2026.firebasestorage.app",
    messagingSenderId: "623493853821",
    appId: "1:623493853821:web:c54ac5c49199613bff3714"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app); const auth = getAuth(app);
  window._fbDb=db; window._fbAuth=auth; window._fbRef=ref; window._fbSet=set;
  window._fbOnValue=onValue; window._fbSignInAnonymously=signInAnonymously;
  window._fbReady=true; window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;}
  input,select,button,textarea{font-family:inherit;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:200;display:flex;flex-direction:column;justify-content:flex-end;}
  .sheet{background:#fff;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(0,0,0,0.12);}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff;z-index:1;}
  .sheet-body{padding:16px 18px 32px;}
  .fab{position:fixed;bottom:20px;right:16px;width:56px;height:56px;border-radius:28px;border:none;background:#ec4899;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(236,72,153,0.4);z-index:100;}
  .whatif-btn{position:fixed;bottom:84px;right:16px;width:44px;height:44px;border-radius:22px;border:none;background:#f59e0b;color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(245,158,11,0.35);z-index:100;}
  .toggle-group{display:flex;gap:6px;}
  .toggle-btn{flex:1;padding:9px 4px;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.15s;border:1.5px solid #ddd;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px;color:#666;display:block;margin-bottom:4px;}
  .text-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e5e5e5;background:#fafafa;color:#1a1a1a;font-size:14px;}
  .text-input:focus{outline:none;border-color:#ec4899;}
  .date-input{width:100%;padding:9px 8px;border-radius:8px;border:1px solid #e5e5e5;background:#fafafa;color:#1a1a1a;font-size:13px;}
  .select-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #e5e5e5;background:#fafafa;color:#1a1a1a;font-size:14px;}
  .btn-primary{width:100%;padding:12px;border-radius:10px;border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;}
  .btn-danger{width:100%;padding:12px;border-radius:10px;border:1px solid #fca5a5;background:transparent;color:#ef4444;font-size:14px;cursor:pointer;}
  .btn-secondary{padding:7px 14px;border-radius:8px;border:1px solid #e5e5e5;background:#fff;color:#666;font-size:12px;cursor:pointer;}
  .flight-card{background:#f9fafb;border:1px solid #f0f0f0;border-radius:10px;padding:10px;margin-bottom:8px;}
  .upload-zone{border:2px dashed #e5e5e5;border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:border-color 0.2s;background:#fafafa;}
  .upload-zone:hover{border-color:#ec4899;}
  .mode-card{padding:16px 12px;border-radius:12px;border:1.5px solid #e5e5e5;background:#fafafa;cursor:pointer;text-align:center;transition:all 0.15s;}
  .mode-card:hover{border-color:#ec4899;background:#fff7fb;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #f59e0b;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .tooltip-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
  .tooltip-box{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;border-radius:6px;padding:3px 7px;font-size:10px;white-space:nowrap;z-index:50;pointer-events:none;}
</style>
</head>
<body>
<div id="root"><div style="padding:32px;text-align:center;color:#888">Connecting…</div></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const HESSEN_PH_MAP = {"2026-01-01":"New Year's Day","2026-04-03":"Good Friday","2026-04-06":"Easter Monday","2026-05-01":"Labour Day","2026-05-14":"Ascension Day","2026-05-25":"Whit Monday","2026-06-04":"Corpus Christi","2026-10-03":"German Unity Day","2026-10-31":"Reformation Day","2026-12-25":"Christmas Day","2026-12-26":"Boxing Day","2027-01-01":"New Year's Day","2027-03-26":"Good Friday","2027-03-29":"Easter Monday","2027-05-01":"Labour Day","2027-05-06":"Ascension Day","2027-05-17":"Whit Monday","2027-05-27":"Corpus Christi","2027-10-03":"German Unity Day","2027-10-31":"Reformation Day","2027-12-25":"Christmas Day","2027-12-26":"Boxing Day"};
const AD_PH_MAP = {"2026-01-01":"New Year's Day","2026-03-20":"Eid Al Fitr","2026-05-27":"Eid Al Adha","2026-05-28":"Eid Al Adha","2026-05-29":"Eid Al Adha","2026-06-16":"Islamic New Year","2026-09-25":"Prophet's Birthday","2026-12-02":"UAE National Day","2026-12-03":"UAE National Day","2027-01-01":"New Year's Day","2027-03-09":"Eid Al Fitr","2027-03-10":"Eid Al Fitr","2027-03-11":"Eid Al Fitr","2027-05-16":"Eid Al Adha","2027-05-17":"Eid Al Adha","2027-05-18":"Eid Al Adha","2027-06-06":"Islamic New Year","2027-09-14":"Prophet's Birthday","2027-12-02":"UAE National Day","2027-12-03":"UAE National Day"};
const HESSEN_PH = new Set(Object.keys(HESSEN_PH_MAP));
const AD_PH = new Set(Object.keys(AD_PH_MAP));

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const CABINS=["Economy","Premium Economy","Business","First"];
const CURRENCIES=["EUR","USD","AED","GBP","CHF"];
const MILES_PROGRAMS=["Etihad Guest","Miles & More","Flying Blue","Avios","United MileagePlus","Emirates Skywards","Other"];
const CORRECT_PIN="050393";
const PIN_KEY="hp_auth_v2";

const DEFAULT={
  salma:{total:40},adis:{total:35},
  trips:[
    {id:1,name:"Mexico",who:"both",start:"2026-03-16",end:"2026-03-31",tripType:"holiday",status:"committed",ptoDays:null,flights:[]},
    {id:2,name:"London (work)",who:"adis",start:"2026-04-28",end:"2026-05-03",tripType:"work",status:"committed",ptoDays:{adis:["2026-05-01"]},flights:[]},
  ],
  scenarios:[]
};

function tripColor(t){
  if(t.tripType==="work")return "#6366f1";
  return t.status==="committed"?"#16a34a":"#f59e0b";
}

function pDate(s){return new Date(s+"T00:00:00");}
function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtLabel(s){const d=pDate(s);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;}

function workDays(start,end,person){
  const ph=person==="salma"?HESSEN_PH:AD_PH;
  const days=[];let d=pDate(start),e=pDate(end);
  while(d<=e){const wd=d.getDay(),ds=fmtD(d);if(wd!==0&&wd!==6&&!ph.has(ds))days.push(ds);d=addD(d,1);}
  return days;
}
function ptoForPerson(trip,person){
  if(!trip.start||!trip.end)return 0;
  const w=workDays(trip.start,trip.end,person);
  if(trip.ptoDays?.[person]!==undefined)return w.filter(d=>trip.ptoDays[person].includes(d)).length;
  return w.length;
}
function getDaysUsed(trips,who,sf){
  return trips.filter(t=>(t.who==="both"||t.who===who)&&(!sf||sf.includes(t.status))).reduce((a,t)=>a+ptoForPerson(t,who),0);
}
function nowTs(){return new Date().toISOString();}
function fmtTs(ts){const d=new Date(ts);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
const emptyFlight=()=>({id:Date.now(),route:"",airline:"",outboundDate:"",returnDate:"",cabin:"Business",cashPriceTotal:"",cashPricePP:"",cashCurrency:"AED",milesPrice:"",milesTaxTotal:"",milesTaxCurrency:"AED",milesProgram:"Etihad Guest",pax:2,isRoundTrip:true,notes:"",recordedAt:nowTs(),screenshots:[]});

async function scanFlightScreenshots(images){
  const res=await fetch("/.netlify/functions/scan-flight",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images,currentYear:new Date().getFullYear()})});
  if(!res.ok)throw new Error(`Function error ${res.status}`);
  return await res.json();
}

// ── Tooltip ───────────────────────────────────────────────────
function Tooltip({text,children}){
  const [show,setShow]=useState(false);
  return(
    <div className="tooltip-wrap" onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>
      {children}
      {show&&<div className="tooltip-box">{text}</div>}
    </div>
  );
}

// ── PIN ───────────────────────────────────────────────────────
function PinScreen({onUnlock}){
  const [pin,setPin]=useState("");const [error,setError]=useState(false);const [loading,setLoading]=useState(false);
  async function submit(){
    if(pin!==CORRECT_PIN){setError(true);setPin("");return;}
    setLoading(true);
    try{await window._fbSignInAnonymously(window._fbAuth);sessionStorage.setItem(PIN_KEY,"1");onUnlock();}
    catch{setError(true);}
    setLoading(false);
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f5f5f5"}}>
      <div style={{background:"#fff",border:"1px solid #f0f0f0",borderRadius:16,padding:"32px 28px",width:300,textAlign:"center",boxShadow:"0 4px 24px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:32,marginBottom:12}}>🗓</div>
        <h2 style={{fontSize:18,fontWeight:600,marginBottom:4}}>Holiday Planner</h2>
        <p style={{fontSize:13,color:"#9ca3af",marginBottom:24}}>Salma & Adis · Enter PIN</p>
        <input type="password" inputMode="numeric" maxLength={6} value={pin} onChange={e=>{setPin(e.target.value);setError(false);}} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="······"
          style={{width:"100%",padding:"12px",borderRadius:10,border:`1.5px solid ${error?"#ef4444":"#e5e5e5"}`,background:"#fafafa",fontSize:22,textAlign:"center",letterSpacing:8,marginBottom:8,boxSizing:"border-box"}}/>
        {error&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>Incorrect PIN</div>}
        <button onClick={submit} disabled={loading||pin.length<4}
          style={{width:"100%",padding:"11px",borderRadius:10,border:"none",background:pin.length>=4?"#ec4899":"#e5e5e5",color:"#fff",fontSize:14,fontWeight:600,cursor:pin.length>=4?"pointer":"default",marginTop:4}}>
          {loading?"Connecting…":"Unlock"}
        </button>
      </div>
    </div>
  );
}

// ── Shared UI ─────────────────────────────────────────────────
function BottomSheet({open,onClose,title,children}){
  useEffect(()=>{document.body.style.overflow=open?"hidden":"";return()=>{document.body.style.overflow="";};},[open]);
  if(!open)return null;
  return(
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-header">
          <span style={{fontWeight:600,fontSize:15}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#aaa",lineHeight:1}}>×</button>
        </div>
        <div className="sheet-body">{children}</div>
      </div>
    </div>
  );
}

function ToggleGroup({options,value,onChange,accent="#ec4899"}){
  return(
    <div className="toggle-group">
      {options.map(([v,l])=>(
        <button key={v} className="toggle-btn" onClick={()=>onChange(v)}
          style={{border:`1.5px solid ${value===v?accent:"#e5e5e5"}`,background:value===v?accent+"15":"#fafafa",color:value===v?accent:"#888",fontWeight:value===v?600:400}}>
          {l}
        </button>
      ))}
    </div>
  );
}

function DayPicker({trip,person,onChange}){
  if(!trip.start||!trip.end||trip.start>trip.end)return null;
  const w=workDays(trip.start,trip.end,person);
  if(!w.length)return<div style={{fontSize:12,color:"#aaa"}}>No working days in range</div>;
  const pto=trip.ptoDays?.[person]??w;
  const toggle=d=>{const cur=trip.ptoDays?.[person]??w;const next=cur.includes(d)?cur.filter(x=>x!==d):[...cur,d].sort();onChange({...trip,ptoDays:{...(trip.ptoDays||{}),[person]:next}});};
  const allPTO=w.every(d=>pto.includes(d));
  const ptoCount=w.filter(d=>pto.includes(d)).length;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:12}}><b style={{color:"#16a34a"}}>{ptoCount} PTO</b>{w.length-ptoCount>0&&<> · <b style={{color:"#3b82f6"}}>{w.length-ptoCount} remote</b></>}</span>
        <button onClick={()=>onChange({...trip,ptoDays:{...(trip.ptoDays||{}),[person]:allPTO?[]:[...w]}})}
          style={{fontSize:11,padding:"3px 10px",borderRadius:20,border:"1px solid #e5e5e5",background:"#fff",color:"#888",cursor:"pointer"}}>
          {allPTO?"All remote":"All PTO"}
        </button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {w.map(d=>{
          const isPTO=pto.includes(d);const dt=pDate(d);
          const dow=["Su","Mo","Tu","We","Th","Fr","Sa"][dt.getDay()];
          return(
            <div key={d} onClick={()=>toggle(d)} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"4px 5px",borderRadius:6,cursor:"pointer",minWidth:34,background:isPTO?"#f0fdf4":"#eff6ff",border:`1px solid ${isPTO?"#16a34a":"#93c5fd"}`,color:isPTO?"#16a34a":"#1d4ed8"}}>
              <span style={{fontSize:9,fontWeight:500}}>{dow}</span>
              <span style={{fontSize:12,fontWeight:600,lineHeight:1.3}}>{dt.getDate()}</span>
              <span style={{fontSize:8}}>{MONTHS[dt.getMonth()].slice(0,3)}</span>
            </div>
          );
        })}
      </div>
      <div style={{fontSize:10,color:"#aaa",marginTop:6}}>Green = PTO · Blue = Remote · Tap to toggle</div>
    </div>
  );
}

// ── Flight Tracker ────────────────────────────────────────────
function FlightTracker({flights=[],onChange}){
  const [adding,setAdding]=useState(false);
  const [form,setForm]=useState(emptyFlight());
  const [scanning,setScanning]=useState(false);
  const [scanError,setScanError]=useState("");
  const [previews,setPreviews]=useState([]);
  const [pendingImages,setPendingImages]=useState([]);
  const [scanResults,setScanResults]=useState(null);
  const [selected,setSelected]=useState({});
  const [mode,setMode]=useState("upload");
  const fileRef=useRef();

  const bestCash=flights.filter(f=>f.cashPricePP||f.cashPriceTotal).sort((a,b)=>+(a.cashPricePP||a.cashPriceTotal)-+(b.cashPricePP||b.cashPriceTotal))[0];
  const bestMiles=flights.filter(f=>f.milesPrice).sort((a,b)=>+a.milesPrice-+b.milesPrice)[0];

  function reset(){setForm(emptyFlight());setPreviews([]);setPendingImages([]);setScanResults(null);setSelected({});setMode("upload");setScanError("");}

  async function handleScreenshot(e){
    const file=e.target.files[0];if(!file)return;fileRef.current.value="";
    setTimeout(async()=>{
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);});
        setPreviews(p=>[...p,dataUrl]);setPendingImages(p=>[...p,{base64Image:dataUrl.split(",")[1],mediaType:file.type}]);setScanError("");
      }catch{setScanError("Failed to load image.");}
    },50);
  }

  async function runScan(){
    if(!pendingImages.length)return;
    setScanning(true);setScanError("");
    try{
      const results=await scanFlightScreenshots(pendingImages);
      if(results&&results.length>0){
        const enriched=results.map(r=>({...r,cashPricePP:r.cashPriceTotal&&r.pax?String(Math.round(+r.cashPriceTotal/r.pax)):null,screenshots:previews}));
        setScanResults(enriched);
        const sel={};enriched.forEach((_,i)=>{sel[i]=true;});setSelected(sel);setMode("review");
      }else{setScanError("No options found.");setMode("manual");}
    }catch{setScanError("Scan failed — try manual entry.");setMode("manual");}
    setScanning(false);
  }

  function saveSelected(){
    const toSave=scanResults.filter((_,i)=>selected[i]);
    if(!toSave.length)return;
    onChange([...flights,...toSave.map(r=>({...emptyFlight(),...r,id:Date.now()+Math.random(),recordedAt:nowTs(),screenshots:previews}))]);
    reset();setAdding(false);
  }

  function saveManual(){if(!form.route)return;onChange([...flights,{...form,id:Date.now(),recordedAt:nowTs()}]);reset();setAdding(false);}
  function deleteEntry(id){onChange(flights.filter(f=>f.id!==id));}
  function removePreview(idx){setPreviews(p=>p.filter((_,i)=>i!==idx));setPendingImages(p=>p.filter((_,i)=>i!==idx));}
  function handlePaxChange(val){const n=+val;setForm(f=>{const total=f.cashPriceTotal?+f.cashPriceTotal:null,pp=f.cashPricePP?+f.cashPricePP:null;return{...f,pax:n,cashPricePP:total&&n?String(Math.round(total/n)):f.cashPricePP,cashPriceTotal:pp&&n?String(Math.round(pp*n)):f.cashPriceTotal};});}
  function handleTotalChange(val){setForm(f=>({...f,cashPriceTotal:val,cashPricePP:val&&f.pax?String(Math.round(+val/f.pax)):""}));}
  function handlePPChange(val){setForm(f=>({...f,cashPricePP:val,cashPriceTotal:val&&f.pax?String(Math.round(+val*f.pax)):""}));}

  const PriceTag=({f})=>(
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:5}}>
      {(f.cashPriceTotal||f.cashPricePP)&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:6,padding:"3px 8px",display:"flex",alignItems:"center",gap:4}}>
        {f.cashPriceTotal&&<span style={{fontSize:11,color:"#16a34a",fontWeight:600}}>{Number(f.cashPriceTotal).toLocaleString()} {f.cashCurrency}</span>}
        {f.cashPricePP&&<span style={{fontSize:11,color:"#16a34a"}}>· {Number(f.cashPricePP).toLocaleString()}/pp</span>}
      </div>}
      {f.milesPrice&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"3px 8px",display:"flex",alignItems:"center",gap:4}}>
        <span style={{fontSize:11,color:"#2563eb",fontWeight:600}}>{Number(f.milesPrice).toLocaleString()} mi</span>
        {f.milesTaxTotal&&<><span style={{color:"#93c5fd"}}>+</span><span style={{fontSize:11,fontWeight:600,color:"#0369a1"}}>{Number(f.milesTaxTotal).toLocaleString()} {f.milesTaxCurrency||"AED"}</span><span style={{fontSize:10,color:"#888"}}>tax</span></>}
        {f.milesProgram&&<span style={{fontSize:10,color:"#888"}}>· {f.milesProgram}</span>}
      </div>}
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:13,fontWeight:600}}>✈️ Flight options</span>
        <button onClick={()=>{if(adding){reset();setAdding(false);}else{reset();setAdding(true);}}} className="btn-secondary">{adding?"Cancel":"+ Add"}</button>
      </div>

      {flights.length>1&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          {bestCash&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:"#16a34a",fontWeight:600,marginBottom:2}}>BEST CASH/PP</div>
            <div style={{fontSize:14,fontWeight:700,color:"#15803d"}}>{Number(bestCash.cashPricePP||bestCash.cashPriceTotal).toLocaleString()} {bestCash.cashCurrency}</div>
            <div style={{fontSize:10,color:"#666"}}>{bestCash.cabin}</div>
          </div>}
          {bestMiles&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:"#2563eb",fontWeight:600,marginBottom:2}}>BEST MILES</div>
            <div style={{fontSize:14,fontWeight:700,color:"#1d4ed8"}}>{Number(bestMiles.milesPrice).toLocaleString()} mi{bestMiles.milesTaxTotal&&<span style={{fontSize:12,color:"#0369a1"}}> +{Number(bestMiles.milesTaxTotal).toLocaleString()} {bestMiles.milesTaxCurrency||"AED"}</span>}</div>
            <div style={{fontSize:10,color:"#666"}}>{bestMiles.milesProgram} · {bestMiles.cabin}</div>
          </div>}

                  <input type="number" className="text-input" value={form.milesTaxTotal} onChange={e=>setForm(f=>({...f,milesTaxTotal:e.target.value}))} style={{fontSize:13,padding:"7px 9px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Tax CCY</label>
                  <select className="select-input" value={form.milesTaxCurrency} onChange={e=>setForm(f=>({...f,milesTaxCurrency:e.target.value}))} style={{fontSize:12,padding:"7px 6px"}}>

          {f.notes&&<div style={{fontSize:11,color:"#666",fontStyle:"italic",marginBottom:3,whiteSpace:"pre-wrap"}}>"{f.notes}"</div>}
          <div style={{fontSize:10,color:"#d1d5db"}}>Recorded {fmtTs(f.recordedAt)}</div>
        </div>
      ))}
    </div>
  );
}

// ── Month Calendar Card ───────────────────────────────────────
function MonthCard({year,month,trips,onTripClick}){
  const dim=new Date(year,month+1,0).getDate();
  const firstDay=(new Date(year,month,1).getDay()+6)%7;
  const today=new Date();
  const mStart=fmtD(new Date(year,month,1));
  const mEnd=fmtD(new Date(year,month,dim));
  const activeTrips=trips.filter(t=>t.start<=mEnd&&t.end>=mStart);

  return(
    <div style={{background:"#fff",borderRadius:14,padding:"12px 10px 10px",border:"0.5px solid #f0f0f0",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
      <div style={{fontWeight:500,fontSize:13,color:"#1a1a1a",marginBottom:8,letterSpacing:0.2}}>{MONTHS[month]}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:2}}>
        {["M","T","W","T","F","S","S"].map((d,i)=>(
          <div key={i} style={{textAlign:"center",fontSize:9,fontWeight:500,color:i>=5?"#e5e7eb":"#d1d5db",paddingBottom:3}}>{d}</div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",rowGap:1}}>
        {Array(firstDay).fill(null).map((_,i)=><div key={`e${i}`}/>)}
        {Array.from({length:dim},(_,i)=>{
          const d=i+1;
          const ds=fmtD(new Date(year,month,d));
          const dow=(firstDay+i)%7;
          const isWE=dow>=5;
          const hPH=HESSEN_PH_MAP[ds];
          const aPH=AD_PH_MAP[ds];
          const dayTrips=activeTrips.filter(t=>ds>=t.start&&ds<=t.end);
          const mainTrip=dayTrips[0];
          const isTod=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
          const col=mainTrip?tripColor(mainTrip):null;
          const isFirst=mainTrip&&ds===(mainTrip.start<mStart?mStart:mainTrip.start);
          const isLast=mainTrip&&ds===(mainTrip.end>mEnd?mEnd:mainTrip.end);
          const isPlanned=mainTrip?.status==="planned"&&mainTrip?.tripType!=="work";

          return(
            <div key={d} style={{position:"relative",display:"flex",flexDirection:"column",alignItems:"center",cursor:mainTrip?"pointer":"default"}}
              onClick={mainTrip?()=>onTripClick(mainTrip):null}>
              {col&&(
                <div style={{
                  position:"absolute",top:2,bottom:2,
                  left:isFirst?"30%":"0%",
                  right:isLast?"30%":"0%",
                  background:isPlanned?"transparent":col+"20",
                  border:isPlanned?`1.5px dashed ${col}77`:"none",
                  borderRadius:isFirst&&isLast?20:isFirst?"20px 0 0 20px":isLast?"0 20px 20px 0":0,
                }}/>
              )}
              <div style={{
                position:"relative",zIndex:1,
                width:22,height:22,
                display:"flex",alignItems:"center",justifyContent:"center",
                borderRadius:11,fontSize:10,
                fontWeight:isTod?600:col?500:400,
                color:isTod?"#fff":col?col:isWE?"#e5e7eb":"#374151",
                background:isTod?"#1a1a1a":"transparent",
              }}>{d}</div>
              <div style={{height:5,display:"flex",gap:2,justifyContent:"center",alignItems:"center"}}>
                {hPH&&<Tooltip text={hPH}><div style={{width:4,height:4,borderRadius:2,background:"#16a34a",cursor:"default"}}/></Tooltip>}
                {aPH&&<Tooltip text={aPH}><div style={{width:4,height:4,borderRadius:2,background:"#3b82f6",cursor:"default"}}/></Tooltip>}
              </div>
            </div>
          );
        })}
      </div>

      {activeTrips.length>0&&(
        <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:3}}>
          {activeTrips.map(t=>{
            const c=tripColor(t);
            const isP=t.status==="planned"&&t.tripType!=="work";
            return(
              <div key={t.id} onClick={()=>onTripClick(t)} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 8px",borderRadius:8,background:isP?"transparent":c+"12",border:isP?`1px dashed ${c}55`:`1px solid ${c}25`,cursor:"pointer"}}>
                <div style={{width:6,height:6,borderRadius:3,background:isP?"transparent":c,border:isP?`1.5px dashed ${c}`:"none",flexShrink:0}}/>
                <span style={{fontSize:11,fontWeight:500,color:c}}>{t.name.replace(/\s*\(work\)\s*/i,"").trim()}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Trip List Card ────────────────────────────────────────────
function TripListCard({trip,onClick}){
  const c=tripColor(trip);
  const isP=trip.status==="planned"&&trip.tripType!=="work";
  const start=pDate(trip.start);
  const end=pDate(trip.end);
  const nights=Math.round((end-start)/86400000);
  const icon=trip.tripType==="work"?"💼":trip.status==="committed"?"✈️":"🔍";
  const displayName=trip.name.replace(/\s*\(work\)\s*/i,"").trim();

  // Build search URLs using destination name
  const dest=encodeURIComponent(displayName);
  const dateFrom=trip.start.replace(/-/g,"");
  const dateTo=trip.end.replace(/-/g,"");
  const gFlights=`https://www.google.com/travel/flights?q=Flights+to+${dest}`;
  const skyscanner=`https://www.skyscanner.com/flights/auh/${dest.toLowerCase()}/${trip.start.slice(0,7).replace("-","")}/`;
  const etihad=`https://www.etihad.com/en-ae/fly-etihad/destinations/${displayName.toLowerCase()}`;

  return(
    <div style={{background:"#fff",borderRadius:14,border:isP?`1px dashed ${c}55`:`0.5px solid ${c}33`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",overflow:"hidden"}}>
      <div onClick={onClick} style={{display:"flex",alignItems:"center",gap:10,padding:"12px",cursor:"pointer"}}>
        <div style={{width:40,height:40,borderRadius:10,background:c+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:500,fontSize:14,color:"#1a1a1a",marginBottom:2}}>{displayName}</div>
          <div style={{fontSize:12,color:"#9ca3af"}}>{fmtLabel(trip.start)} – {fmtLabel(trip.end)} · {nights} nights</div>
          {trip.flights?.length>0&&<div style={{fontSize:11,color:c,marginTop:2}}>✈ {trip.flights.length} flight option{trip.flights.length>1?"s":""}</div>}
        </div>
      </div>
      {/* Quick search links */}
      <div style={{display:"flex",borderTop:`1px solid #f5f5f5`,padding:"6px 12px",gap:6}}>
        {[
          {label:"Google Flights",url:gFlights,bg:"#e8f0fe",color:"#1a73e8"},
          {label:"Skyscanner",url:skyscanner,bg:"#e8f5e9",color:"#0770e3"},
          {label:"Etihad",url:etihad,bg:"#fff3e0",color:"#bd8b13"},
        ].map(l=>(
          <a key={l.label} href={l.url} target="_blank" rel="noopener noreferrer"
            style={{flex:1,padding:"5px 4px",borderRadius:8,background:l.bg,color:l.color,fontSize:10,fontWeight:600,textAlign:"center",textDecoration:"none",display:"block"}}>
            {l.label}
          </a>
        ))}
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App(){
  const [unlocked,setUnlocked]=useState(!!sessionStorage.getItem(PIN_KEY));
  useEffect(()=>{if(unlocked&&window._fbAuth&&!window._fbAuth.currentUser)window._fbSignInAnonymously(window._fbAuth).catch(console.error);},[unlocked]);
  if(!unlocked)return<PinScreen onUnlock={()=>setUnlocked(true)}/>;
  return<Planner/>;
}

function Planner(){
  const [state,setState]=useState(null);
  const [synced,setSynced]=useState(false);
  const [year,setYear]=useState(2026);
  const [mainTab,setMainTab]=useState("calendar");
  const [sheet,setSheet]=useState(null);
  const [editTrip,setEditTrip]=useState(null);
  const [pickerPerson,setPickerPerson]=useState("salma");
  const [whatIf,setWhatIf]=useState({month:"2026-07",days:5,who:"both"});
  const [activeTab,setActiveTab]=useState("details");
  const [tripCreateMode,setTripCreateMode]=useState(null);
  const [tripScanning,setTripScanning]=useState(false);
  const [tripScanError,setTripScanError]=useState("");
  const [tripScanPreviews,setTripScanPreviews]=useState([]);
  const [tripPendingImages,setTripPendingImages]=useState([]);
  const tripFileRef=useRef();
  const skipSave=useRef(false);

  useEffect(()=>{
    function init(){
      const r=window._fbRef(window._fbDb,"planner");
      window._fbOnValue(r,snap=>{
        const val=snap.val();skipSave.current=true;
        const s=val||DEFAULT;
        s.trips=(s.trips||[]).map(t=>({flights:[],tripType:"holiday",...t}));
        s.scenarios=(s.scenarios||[]).map(t=>({flights:[],tripType:"holiday",...t}));
        setState(s);setSynced(true);
        setTimeout(()=>{skipSave.current=false;},100);
      });
    }
    if(window._fbReady)init();
    else window.addEventListener("firebase-ready",init,{once:true});
  },[]);

  useEffect(()=>{
    if(!state||skipSave.current)return;
    const strip=trips=>trips.map(t=>({...t,flights:(t.flights||[]).map(f=>({...f,screenshots:[]}))}));
    const s={...state,trips:strip(state.trips),scenarios:strip(state.scenarios)};
    window._fbSet(window._fbRef(window._fbDb,"planner"),s).catch(console.error);
  },[state]);

  function save(s){setState(s);}
  if(!state)return<div style={{padding:32,textAlign:"center",color:"#9ca3af",fontSize:14}}>Loading…</div>;

  const all=[...state.trips,...state.scenarios];
  const sUsed=getDaysUsed(all,"salma",["committed"]),sPlanned=getDaysUsed(all,"salma",["planned"]);
  const aUsed=getDaysUsed(all,"adis",["committed"]),aPlanned=getDaysUsed(all,"adis",["planned"]);
  const sLeft=state.salma.total-sUsed,aLeft=state.adis.total-aUsed;
  const balCol=n=>n<=5?"#ef4444":n<=10?"#f59e0b":"#16a34a";
  const pct=(u,t)=>Math.min(100,Math.round((u/t)*100));

  function openNew(){
    setEditTrip({id:Date.now(),name:"",who:"both",start:"",end:"",tripType:"holiday",status:"planned",ptoDays:null,flights:[],isNew:true});
    setPickerPerson("salma");setActiveTab("details");setTripCreateMode(null);
    setTripScanError("");setTripScanPreviews([]);setTripPendingImages([]);setSheet("trip");
  }
  function openEdit(t){setEditTrip({flights:[],tripType:"holiday",...t});setPickerPerson(t.who==="adis"?"adis":"salma");setActiveTab("details");setTripCreateMode("manual");setSheet("trip");}

  async function handleTripScreenshot(e){
    const file=e.target.files[0];if(!file)return;tripFileRef.current.value="";
    setTimeout(async()=>{
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);});
        setTripScanPreviews(p=>[...p,dataUrl]);setTripPendingImages(p=>[...p,{base64Image:dataUrl.split(",")[1],mediaType:file.type}]);setTripScanError("");
      }catch{setTripScanError("Failed to load image.");}
    },50);
  }

  async function runTripScan(){
    if(!tripPendingImages.length)return;
    setTripScanning(true);setTripScanError("");
    try{
      const results=await scanFlightScreenshots(tripPendingImages);
      if(results&&results.length>0){
        const r=results[0];
        const dest=r.route?r.route.split(/->|→/).pop().trim():"";
        const pax=r.pax||2;const total=r.cashPriceTotal?String(r.cashPriceTotal):"";
        const flight={...emptyFlight(),id:Date.now(),route:r.route||"",airline:r.airline||"",outboundDate:r.outboundDate||"",returnDate:r.returnDate||"",cabin:CABINS.includes(r.cabin)?r.cabin:"Economy",cashPriceTotal:total,cashPricePP:total&&pax?String(Math.round(+total/pax)):"",cashCurrency:CURRENCIES.includes(r.cashCurrency)?r.cashCurrency:"AED",milesPrice:r.milesPrice?String(r.milesPrice):"",milesTaxTotal:r.milesTaxTotal?String(r.milesTaxTotal):"",milesTaxCurrency:r.milesTaxCurrency||"AED",milesProgram:r.milesProgram||"Etihad Guest",pax,isRoundTrip:r.isRoundTrip??true,notes:r.notes||"",recordedAt:nowTs(),screenshots:tripScanPreviews};
        setEditTrip(t=>({...t,name:dest||t.name,start:r.outboundDate||t.start,end:r.returnDate||r.outboundDate||t.end,flights:[flight]}));
        setTripCreateMode("manual");setActiveTab("details");
      }else{setTripScanError("Couldn't read — fill manually.");}
    }catch{setTripScanError("Failed to process.");}
    setTripScanning(false);
  }

  function saveTrip(trip){
    const{isNew,...t}=trip;const isScen=t.status==="planned";
    const others=[...state.trips,...state.scenarios].filter(x=>x.id!==t.id);
    save({...state,trips:[...others.filter(x=>x.status==="committed"),...(isScen?[]:[t])],scenarios:[...others.filter(x=>x.status==="planned"),...(isScen?[t]:[])]});
    setSheet(null);
  }
  function deleteTrip(id){save({...state,trips:state.trips.filter(x=>x.id!==id),scenarios:state.scenarios.filter(x=>x.id!==id)});setSheet(null);}
  function updateFlights(tripId,flights){
    const upd=list=>list.map(t=>t.id===tripId?{...t,flights}:t);
    save({...state,trips:upd(state.trips),scenarios:upd(state.scenarios)});
    setEditTrip(t=>({...t,flights}));
  }

  const pickerPeople=editTrip?.who==="both"?["salma","adis"]:editTrip?.who==="salma"?["salma"]:["adis"];
  const sWI=sLeft-(whatIf.who!=="adis"?whatIf.days:0),aWI=aLeft-(whatIf.who!=="salma"?whatIf.days:0);
  const committed=all.filter(t=>t.status==="committed").sort((a,b)=>a.start.localeCompare(b.start));
  const planned=all.filter(t=>t.status==="planned").sort((a,b)=>a.start.localeCompare(b.start));

  return(
    <div style={{maxWidth:480,margin:"0 auto",background:"#f5f5f5",minHeight:"100vh"}}>

      {/* Sticky header */}
      <div style={{background:"#fff",padding:"16px 14px 0",borderBottom:"0.5px solid #f0f0f0",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:18,fontWeight:600,color:"#1a1a1a",letterSpacing:-0.3}}>Holidays</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:1,display:"flex",alignItems:"center",gap:5}}>
              Salma & Adis
              <span style={{display:"flex",alignItems:"center",gap:3,color:synced?"#16a34a":"#9ca3af"}}>
                <div style={{width:5,height:5,borderRadius:3,background:synced?"#16a34a":"#d1d5db"}}/>
                {synced?"live":"connecting"}
              </span>
            </div>
          </div>
          {/* Year switcher */}
          <div style={{display:"flex",gap:4}}>
            {[2026,2027].map(y=>(
              <button key={y} onClick={()=>setYear(y)} style={{padding:"4px 10px",borderRadius:20,border:"1px solid #e5e5e5",background:year===y?"#1a1a1a":"#fff",color:year===y?"#fff":"#9ca3af",cursor:"pointer",fontSize:12,fontWeight:year===y?600:400}}>{y}</button>
            ))}
          </div>
        </div>

        {/* Balance cards */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
          {[{name:"Salma",left:sLeft,used:sUsed,planned:sPlanned,total:state.salma.total},{name:"Adis",left:aLeft,used:aUsed,planned:aPlanned,total:state.adis.total}].map(p=>(
            <div key={p.name} style={{background:"#f9fafb",borderRadius:12,padding:"10px 12px",border:"0.5px solid #f0f0f0"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                <span style={{fontSize:12,color:"#6b7280",fontWeight:500}}>{p.name}</span>
                <span style={{fontSize:20,fontWeight:600,color:balCol(p.left)}}>{p.left}</span>
              </div>
              <div style={{height:3,borderRadius:2,background:"#e5e7eb",overflow:"hidden",marginBottom:4}}>
                <div style={{height:"100%",borderRadius:2,background:"#16a34a",width:`${pct(p.used,p.total)}%`}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontSize:10,color:"#d1d5db"}}>{p.used} used</span>
                {p.planned>0&&<span style={{fontSize:10,color:"#f59e0b"}}>{p.planned} planned</span>}
                <span style={{fontSize:10,color:"#d1d5db"}}>{p.total} days</span>
              </div>
            </div>
          ))}
        </div>

        {/* Legend */}
        <div style={{display:"flex",gap:10,flexWrap:"wrap",paddingBottom:10}}>
          {[{c:"#16a34a",label:"Committed",bar:true},{c:"#f59e0b",label:"Planned",bar:true,dashed:true},{c:"#6366f1",label:"Work",bar:true},{c:"#16a34a",label:"Hessen PH",dot:true},{c:"#3b82f6",label:"UAE PH",dot:true}].map(l=>(
            <div key={l.label} style={{display:"flex",alignItems:"center",gap:4}}>
              {l.dot?<div style={{width:6,height:6,borderRadius:3,background:l.c}}/>:
               <div style={{width:14,height:6,borderRadius:3,background:l.dashed?"transparent":l.c+"25",border:l.dashed?`1.5px dashed ${l.c}88`:`1px solid ${l.c}55`}}/>}
              <span style={{fontSize:10,color:"#9ca3af"}}>{l.label}</span>
            </div>
          ))}
        </div>

        {/* Main tabs */}
        <div style={{display:"flex",marginBottom:-1}}>
          {[["calendar","Calendar"],["trips","Trips"]].map(([v,l])=>(
            <button key={v} onClick={()=>setMainTab(v)} style={{flex:1,padding:"8px 0",border:"none",background:"transparent",fontSize:13,fontWeight:mainTab===v?600:400,cursor:"pointer",color:mainTab===v?"#1a1a1a":"#9ca3af",borderBottom:mainTab===v?"2px solid #1a1a1a":"2px solid transparent",marginBottom:-1}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{padding:"10px 10px 100px",display:"flex",flexDirection:"column",gap:8}}>

        {/* Calendar view */}
        {mainTab==="calendar"&&Array.from({length:12},(_,i)=>(
          <MonthCard key={i} year={year} month={i} trips={all} onTripClick={openEdit}/>
        ))}

        {/* Trips view */}
        {mainTab==="trips"&&(
          <>
            {committed.length>0&&(
              <>
                <div style={{fontSize:11,fontWeight:600,color:"#9ca3af",padding:"4px 2px",letterSpacing:0.8,textTransform:"uppercase"}}>Committed</div>
                {committed.map(t=><TripListCard key={t.id} trip={t} onClick={()=>openEdit(t)}/>)}
              </>
            )}
            {planned.length>0&&(
              <>
                <div style={{fontSize:11,fontWeight:600,color:"#9ca3af",padding:"8px 2px 4px",letterSpacing:0.8,textTransform:"uppercase"}}>Planned</div>
                {planned.map(t=><TripListCard key={t.id} trip={t} onClick={()=>openEdit(t)}/>)}
              </>
            )}
            {all.length===0&&<div style={{textAlign:"center",padding:"32px 0",color:"#d1d5db",fontSize:14}}>No trips yet — tap + to add one</div>}
          </>
        )}
      </div>

      {/* FABs */}
      <button className="whatif-btn" onClick={()=>setSheet(s=>s==="whatif"?null:"whatif")}>?</button>
      <button className="fab" onClick={openNew}>+</button>

      {/* Trip sheet */}
      <BottomSheet open={sheet==="trip"} onClose={()=>{setSheet(null);setTripCreateMode(null);setTripScanError("");setTripScanPreviews([]);setTripPendingImages([]);}} title={editTrip?.isNew?"New trip":editTrip?.name||"Edit trip"}>
        {editTrip&&(
          <>
            {/* Mode picker */}
            {editTrip.isNew&&tripCreateMode===null&&(
              <div>
                <p style={{fontSize:13,color:"#9ca3af",marginBottom:14,textAlign:"center"}}>How would you like to start?</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div className="mode-card" onClick={()=>setTripCreateMode("screenshot")}>
                    <div style={{fontSize:28,marginBottom:8}}>📸</div>
                    <div style={{fontSize:13,fontWeight:600,color:"#1a1a1a",marginBottom:4}}>From screenshot</div>
                    <div style={{fontSize:11,color:"#9ca3af"}}>Auto-fill from flight search</div>
                  </div>
                  <div className="mode-card" onClick={()=>setTripCreateMode("manual")}>
                    <div style={{fontSize:28,marginBottom:8}}>✏️</div>
                    <div style={{fontSize:13,fontWeight:600,color:"#1a1a1a",marginBottom:4}}>Manual</div>
                    <div style={{fontSize:11,color:"#9ca3af"}}>Fill in details yourself</div>
                  </div>
                </div>
              </div>
            )}

            {/* Screenshot scan */}
            {editTrip.isNew&&tripCreateMode==="screenshot"&&(
              <div>
                <input type="file" accept="image/*" ref={tripFileRef} style={{display:"none"}} onChange={handleTripScreenshot}/>
                {tripScanning?(
                  <div style={{textAlign:"center",padding:"32px 0",color:"#f59e0b"}}>
                    <span className="spinner"/><span style={{fontSize:14,marginLeft:8}}>Reading screenshots…</span>
                  </div>
                ):(
                  <>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <span style={{fontSize:13,fontWeight:600,color:"#555"}}>Add screenshots</span>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>tripFileRef.current.click()} className="btn-secondary" style={{fontSize:12,padding:"5px 12px"}}>📸 Add</button>
                        {tripPendingImages.length>0&&(
                          <button onClick={runTripScan} style={{padding:"5px 14px",borderRadius:8,border:"none",background:"#ec4899",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>
                            ✨ Scan {tripPendingImages.length}
                          </button>
                        )}
                      </div>
                    </div>
                    {tripScanError&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10}}>{tripScanError}</div>}
                    {tripScanPreviews.length===0?(
                      <div className="upload-zone" onClick={()=>tripFileRef.current.click()} style={{padding:24,marginBottom:12}}>
                        <div style={{fontSize:32,marginBottom:8}}>📸</div>
                        <div style={{fontSize:14,fontWeight:600,color:"#1a1a1a",marginBottom:4}}>Upload flight screenshots</div>
                        <div style={{fontSize:12,color:"#9ca3af"}}>Add outbound + return, then tap Scan</div>
                      </div>
                    ):(
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                        {tripScanPreviews.map((src,i)=>(
                          <div key={i} style={{position:"relative",width:80,height:80}}>
                            <img src={src} style={{width:80,height:80,objectFit:"cover",borderRadius:10,border:"1px solid #f0f0f0"}} alt=""/>
                            <button onClick={()=>{setTripScanPreviews(p=>p.filter((_,j)=>j!==i));setTripPendingImages(p=>p.filter((_,j)=>j!==i));}}
                              style={{position:"absolute",top:-4,right:-4,background:"#ef4444",border:"none",borderRadius:10,color:"#fff",width:20,height:20,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                          </div>
                        ))}
                        <div onClick={()=>tripFileRef.current.click()} style={{width:80,height:80,borderRadius:10,border:"2px dashed #e5e5e5",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#d1d5db",fontSize:24}}>+</div>
                      </div>
                    )}
                    <button onClick={()=>setTripCreateMode("manual")} style={{width:"100%",padding:"9px",borderRadius:8,border:"1px solid #e5e5e5",background:"transparent",color:"#9ca3af",fontSize:13,cursor:"pointer"}}>
                      ✏️ Fill in manually instead
                    </button>
                  </>
                )}
              </div>
            )}

            {/* Trip form */}
            {(!editTrip.isNew||tripCreateMode==="manual")&&(
              <>
                <div style={{display:"flex",gap:0,marginBottom:16,borderBottom:"1px solid #f0f0f0"}}>
                  {[["details","Details"],["flights",`Flights${editTrip.flights?.length>0?` (${editTrip.flights.length})`:""}`]].map(([t,l])=>(
                    <button key={t} onClick={()=>setActiveTab(t)}
                      style={{flex:1,padding:"8px 4px",border:"none",background:"transparent",color:activeTab===t?"#1a1a1a":"#9ca3af",fontWeight:activeTab===t?600:400,fontSize:13,cursor:"pointer",borderBottom:activeTab===t?"2px solid #1a1a1a":"2px solid transparent",marginBottom:-1}}>
                      {l}
                    </button>
                  ))}
                </div>

                {activeTab==="details"&&(
                  <>
                    <div className="field"><label>Trip name</label>
                      <input className="text-input" value={editTrip.name} onChange={e=>setEditTrip(t=>({...t,name:e.target.value}))} placeholder="e.g. Bali, Japan…"/></div>
                    <div className="field"><label>Trip type</label>
                      <ToggleGroup options={[["holiday","🌴 Holiday"],["work","💼 Work"]]} value={editTrip.tripType||"holiday"}
                        onChange={v=>setEditTrip(t=>({...t,tripType:v}))} accent="#6366f1"/></div>
                    <div className="field"><label>Who's going?</label>
                      <ToggleGroup options={[["both","👫 Both"],["salma","Salma"],["adis","Adis"]]} value={editTrip.who}
                        onChange={v=>{setEditTrip(t=>({...t,who:v,ptoDays:null}));setPickerPerson(v==="adis"?"adis":"salma");}}/></div>
                    <div className="field"><label>Status</label>
                      <ToggleGroup options={[["committed","✓ Committed"],["planned","~ Planned"]]} value={editTrip.status}
                        onChange={v=>setEditTrip(t=>({...t,status:v}))} accent={editTrip.status==="committed"?"#16a34a":"#f59e0b"}/></div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                      <div className="field" style={{marginBottom:0}}><label>Start</label>
                        <input type="date" className="date-input" value={editTrip.start} onChange={e=>setEditTrip(t=>({...t,start:e.target.value,ptoDays:null}))}/></div>
                      <div className="field" style={{marginBottom:0}}><label>End</label>
                        <input type="date" className="date-input" value={editTrip.end} onChange={e=>setEditTrip(t=>({...t,end:e.target.value,ptoDays:null}))}/></div>
                    </div>
                    {editTrip.start&&editTrip.end&&editTrip.start<=editTrip.end&&(
                      <div className="field"><label>PTO vs Remote days</label>
                        <div style={{background:"#f9fafb",borderRadius:10,padding:10,border:"1px solid #f0f0f0"}}>
                          {pickerPeople.length>1&&(
                            <div style={{display:"flex",gap:6,marginBottom:10}}>
                              {pickerPeople.map(p=>(
                                <button key={p} onClick={()=>setPickerPerson(p)} style={{padding:"4px 14px",borderRadius:20,border:`1px solid ${pickerPerson===p?"#16a34a":"#e5e5e5"}`,background:pickerPerson===p?"#f0fdf4":"#fff",color:pickerPerson===p?"#16a34a":"#9ca3af",cursor:"pointer",fontSize:12,fontWeight:pickerPerson===p?600:400,textTransform:"capitalize"}}>
                                  {p}
                                </button>
                              ))}
                            </div>
                          )}
                          <DayPicker trip={editTrip} person={pickerPerson} onChange={setEditTrip}/>
                        </div>
                      </div>
                    )}
                    <button className="btn-primary" onClick={()=>saveTrip(editTrip)} disabled={!editTrip.name||!editTrip.start||!editTrip.end||editTrip.start>editTrip.end}
                      style={{background:(editTrip.name&&editTrip.start&&editTrip.end&&editTrip.start<=editTrip.end)?"#16a34a":"#e5e5e5"}}>
                      {editTrip.isNew?"Add trip":"Save changes"}
                    </button>
                    {!editTrip.isNew&&<button className="btn-danger" onClick={()=>deleteTrip(editTrip.id)}>Delete trip</button>}
                  </>
                )}

                {activeTab==="flights"&&(
                  <FlightTracker flights={editTrip.flights||[]}
                    onChange={flights=>{setEditTrip(t=>({...t,flights}));if(!editTrip.isNew)updateFlights(editTrip.id,flights);}}/>
                )}
              </>
            )}
          </>
        )}
      </BottomSheet>

      {/* What-if sheet */}
      <BottomSheet open={sheet==="whatif"} onClose={()=>setSheet(null)} title="What-if scenario">
        <div className="field"><label>Month</label>
          <select className="select-input" value={whatIf.month} onChange={e=>setWhatIf(w=>({...w,month:e.target.value}))}>
            {[2026,2027].flatMap(y=>Array.from({length:12},(_,i)=>{const v=`${y}-${String(i+1).padStart(2,"0")}`;return<option key={v} value={v}>{MONTHS[i]} {y}</option>;}))}
          </select></div>
        <div className="field"><label>Who</label>
          <ToggleGroup options={[["both","👫 Both"],["salma","Salma"],["adis","Adis"]]} value={whatIf.who} onChange={v=>setWhatIf(w=>({...w,who:v}))} accent="#f59e0b"/></div>
        <div className="field"><label>PTO days: <b style={{fontSize:15}}>{whatIf.days}</b></label>
          <input type="range" min={1} max={30} value={whatIf.days} onChange={e=>setWhatIf(w=>({...w,days:+e.target.value}))} style={{width:"100%",accentColor:"#f59e0b",height:24}}/></div>
        <div style={{background:"#f9fafb",borderRadius:10,padding:14,border:"1px solid #f0f0f0",marginBottom:16}}>
          {whatIf.who!=="adis"&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13}}><span style={{color:"#9ca3af"}}>Salma</span><span><b>{sLeft}</b> → <b style={{color:sWI<0?"#ef4444":"#16a34a",fontSize:15}}>{sWI}</b> days left</span></div>}
          {whatIf.who!=="salma"&&<div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span style={{color:"#9ca3af"}}>Adis</span><span><b>{aLeft}</b> → <b style={{color:aWI<0?"#ef4444":"#16a34a",fontSize:15}}>{aWI}</b> days left</span></div>}
        </div>
        <button className="btn-primary" onClick={()=>{
          const[y,m]=whatIf.month.split("-").map(Number);
          const s=fmtD(new Date(y,m-1,1)),e=fmtD(new Date(y,m-1,whatIf.days));
          saveTrip({id:Date.now(),name:`Scenario ${MONTHS[m-1]}`,who:whatIf.who,start:s,end:e,tripType:"holiday",status:"planned",ptoDays:null,flights:[],isNew:true});
          setSheet(null);
        }} style={{background:"#f59e0b"}}>Add to calendar as planned</button>
      </BottomSheet>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
