  .text-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#fafafa;color:#1a1a1a;font-size:14px;}
  .text-input:focus{outline:none;border-color:#ec4899;}
  .date-input{width:100%;padding:9px 8px;border-radius:8px;border:1px solid #ddd;background:#fafafa;color:#1a1a1a;font-size:13px;}
  .select-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#fafafa;color:#1a1a1a;font-size:14px;}
  .btn-primary{width:100%;padding:12px;border-radius:10px;border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;}
  .btn-danger{width:100%;padding:12px;border-radius:10px;border:1px solid #fca5a5;background:transparent;color:#ef4444;font-size:14px;cursor:pointer;}
  .btn-secondary{padding:7px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#666;font-size:12px;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  @media(max-width:400px){.cal-grid{grid-template-columns:1fr;}}
  .month-card{background:#fff;border:1px solid #e5e5e5;border-radius:10px;padding:8px;}

  .balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .balance-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px;}
  .sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;}

  @keyframes spin{to{transform:rotate(360deg);}}
  .mode-card{padding:16px 12px;border-radius:10px;border:1.5px solid #e5e5e5;background:#fafafa;cursor:pointer;text-align:center;transition:all 0.15s;}
  .mode-card:hover{border-color:#ec4899;background:#fff7fb;}
</style>

<body>
<div id="root"><div style="padding:32px;text-align:center;color:#888">Connecting…</div></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const HESSEN_PH=new Set(["2026-01-01","2026-04-03","2026-04-06","2026-05-01","2026-05-14","2026-05-25","2026-06-04","2026-10-03","2026-10-31","2026-12-25","2026-12-26","2027-01-01","2027-03-26","2027-03-29","2027-05-01","2027-05-06","2027-05-17","2027-05-27","2027-10-03","2027-10-31","2027-12-25","2027-12-26"]);
const AD_PH=new Set(["2026-01-01","2026-03-20","2026-05-27","2026-05-28","2026-05-29","2026-06-16","2026-09-25","2026-12-02","2026-12-03","2027-01-01","2027-03-09","2027-03-10","2027-03-11","2027-05-16","2027-05-17","2027-05-18","2027-06-06","2027-09-14","2027-12-02","2027-12-03"]);
const PH_NAMES={"2026-01-01":"New Year's Day","2026-04-03":"Good Friday","2026-04-06":"Easter Monday","2026-05-01":"Labour Day","2026-05-14":"Ascension Day","2026-05-25":"Whit Monday","2026-06-04":"Corpus Christi","2026-10-03":"German Unity Day","2026-10-31":"Reformation Day","2026-12-25":"Christmas Day","2026-12-26":"Boxing Day","2027-01-01":"New Year's Day","2027-03-26":"Good Friday","2027-03-29":"Easter Monday","2027-05-01":"Labour Day","2027-05-06":"Ascension Day","2027-05-17":"Whit Monday","2027-05-27":"Corpus Christi","2027-10-03":"German Unity Day","2027-10-31":"Reformation Day","2027-12-25":"Christmas Day","2027-12-26":"Boxing Day","2026-03-20":"Eid Al Fitr (est.)","2026-05-27":"Eid Al Adha (est.)","2026-05-28":"Eid Al Adha (est.)","2026-05-29":"Eid Al Adha (est.)","2026-06-16":"Islamic New Year (est.)","2026-09-25":"Prophet's Birthday (est.)","2026-12-02":"UAE National Day","2026-12-03":"UAE National Day","2027-03-09":"Eid Al Fitr (est.)","2027-03-10":"Eid Al Fitr (est.)","2027-03-11":"Eid Al Fitr (est.)","2027-05-16":"Eid Al Adha (est.)","2027-05-17":"Eid Al Adha (est.)","2027-05-18":"Eid Al Adha (est.)","2027-06-06":"Islamic New Year (est.)","2027-09-14":"Prophet's Birthday (est.)","2027-12-02":"UAE National Day","2027-12-03":"UAE National Day"};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const COLORS=["#ec4899","#f59e0b","#10b981","#ef4444","#8b5cf6","#14b8a6","#6366f1","#f97316"];
const CABINS=["Economy","Premium Economy","Business","First"];
const CURRENCIES=["EUR","USD","AED","GBP","CHF"];
const MILES_PROGRAMS=["Etihad Guest","Miles & More","Flying Blue","Avios","United MileagePlus","Emirates Skywards","Other"];
const CORRECT_PIN="050393";
const PIN_KEY="hp_auth_v2";

const DEFAULT={
  salma:{total:40},adis:{total:35},
  trips:[
    {id:1,name:"Mexico",who:"both",start:"2026-03-16",end:"2026-03-31",status:"committed",color:"#ec4899",ptoDays:null,flights:[]},
    {id:2,name:"London (work)",who:"adis",start:"2026-04-28",end:"2026-05-03",status:"committed",color:"#14b8a6",ptoDays:{adis:["2026-05-01"]},flights:[]},
  ],
  scenarios:[]
};

function pDate(s){return new Date(s+"T00:00:00");}
function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function workDays(start,end,person){
  const ph=person==="salma"?HESSEN_PH:AD_PH;
  const days=[];let d=pDate(start),e=pDate(end);
  while(d<=e){const wd=d.getDay(),ds=fmtD(d);if(wd!==0&&wd!==6&&!ph.has(ds))days.push(ds);d=addD(d,1);}
  return days;
}
function ptoForPerson(trip,person){
  if(!trip.start||!trip.end)return 0;
  const w=workDays(trip.start,trip.end,person);
  if(trip.ptoDays?.[person]!==undefined)return w.filter(d=>trip.ptoDays[person].includes(d)).length;
  return w.length;
}
function getDaysUsed(trips,who,sf){
  return trips.filter(t=>(t.who==="both"||t.who===who)&&(!sf||sf.includes(t.status))).reduce((a,t)=>a+ptoForPerson(t,who),0);
}
function nowTs(){return new Date().toISOString();}
function fmtTs(ts){const d=new Date(ts);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}
const emptyFlight=()=>({id:Date.now(),route:"",airline:"",outboundDate:"",returnDate:"",cabin:"Business",cashPriceTotal:"",cashPricePP:"",cashCurrency:"AED",milesPrice:"",milesTaxTotal:"",milesTaxCurrency:"AED",milesProgram:"Etihad Guest",pax:2,isRoundTrip:true,notes:"",recordedAt:nowTs(),screenshots:[]});

async function scanFlightScreenshots(images){
  const res=await fetch("/.netlify/functions/scan-flight",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images,currentYear:new Date().getFullYear()})});
  if(!res.ok)throw new Error(`Function error ${res.status}`);
  return await res.json();
}

// ── PIN ──────────────────────────────────────────────────────
function PinScreen({onUnlock}){
  const [pin,setPin]=useState(""); const [error,setError]=useState(false); const [loading,setLoading]=useState(false);
  async function submit(){
    if(pin!==CORRECT_PIN){setError(true);setPin("");return;}
    setLoading(true);
    try{await window._fbSignInAnonymously(window._fbAuth);sessionStorage.setItem(PIN_KEY,"1");onUnlock();}
    catch{setError(true);}
    setLoading(false);
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f5f5f5"}}>
      <div style={{background:"#fff",border:"1px solid #e5e5e5",borderRadius:16,padding:"32px 28px",width:300,textAlign:"center",boxShadow:"0 4px 24px rgba(0,0,0,0.08)"}}>
        <div style={{fontSize:32,marginBottom:12}}>🗓</div>
        <h2 style={{fontSize:18,fontWeight:700,marginBottom:4}}>Holiday Planner</h2>
        <p style={{fontSize:13,color:"#888",marginBottom:24}}>Salma & Adis · Enter PIN to continue</p>
        <input type="password" inputMode="numeric" maxLength={6} value={pin} onChange={e=>{setPin(e.target.value);setError(false);}} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="······"
          style={{width:"100%",padding:"12px",borderRadius:8,border:`1.5px solid ${error?"#ef4444":"#ddd"}`,background:"#fafafa",fontSize:22,textAlign:"center",letterSpacing:6,marginBottom:8,boxSizing:"border-box"}}/>
        {error&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>Incorrect PIN — try again</div>}
        <button onClick={submit} disabled={loading||pin.length<4}
          style={{width:"100%",padding:"11px",borderRadius:8,border:"none",background:pin.length>=4?"#ec4899":"#e5e5e5",color:"#fff",fontSize:14,fontWeight:700,cursor:pin.length>=4?"pointer":"default",marginTop:4}}>
          {loading?"Connecting…":"Unlock"}
        </button>
      </div>
    </div>
  );
}

// ── Shared UI ─────────────────────────────────────────────────
function BottomSheet({open,onClose,title,children}){
  useEffect(()=>{document.body.style.overflow=open?"hidden":"";return()=>{document.body.style.overflow="";};},[open]);
  if(!open)return null;
  return(
    <div className="sheet-overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-header">
          <span style={{fontWeight:700,fontSize:15}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#aaa",lineHeight:1}}>×</button>
        </div>
        <div className="sheet-body">{children}</div>
      </div>
    </div>
  );
}
function ToggleGroup({options,value,onChange,accent="#ec4899"}){
  return(
    <div className="toggle-group">
      {options.map(([v,l])=>(
        <button key={v} className="toggle-btn" onClick={()=>onChange(v)}
          style={{border:`1.5px solid ${value===v?accent:"#ddd"}`,background:value===v?accent+"18":"#fafafa",color:value===v?accent:"#888",fontWeight:value===v?700:400}}>
          {l}
        </button>
      ))}
    </div>
  );
}
function DayPicker({trip,person,onChange}){
  if(!trip.start||!trip.end||trip.start>trip.end)return null;
  const w=workDays(trip.start,trip.end,person);
  if(!w.length)return<div style={{fontSize:12,color:"#aaa"}}>No working days in range</div>;
  const pto=trip.ptoDays?.[person]??w;
  const toggle=d=>{const cur=trip.ptoDays?.[person]??w;const next=cur.includes(d)?cur.filter(x=>x!==d):[...cur,d].sort();onChange({...trip,ptoDays:{...(trip.ptoDays||{}),[person]:next}});};
  const allPTO=w.every(d=>pto.includes(d));
  const ptoCount=w.filter(d=>pto.includes(d)).length;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:12}}><b style={{color:"#ec4899"}}>{ptoCount} PTO</b>{w.length-ptoCount>0&&<> · <b style={{color:"#3b82f6"}}>{w.length-ptoCount} remote</b></>}</span>
        <button onClick={()=>onChange({...trip,ptoDays:{...(trip.ptoDays||{}),[person]:allPTO?[]:[...w]}})}
          style={{fontSize:11,padding:"3px 10px",borderRadius:20,border:"1px solid #ddd",background:"#fff",color:"#888",cursor:"pointer"}}>
          {allPTO?"All remote":"All PTO"}
        </button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {w.map(d=>{
          const isPTO=pto.includes(d);const dt=pDate(d);
          const dow=["Su","Mo","Tu","We","Th","Fr","Sa"][dt.getDay()];
          return(
            <div key={d} onClick={()=>toggle(d)} style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"4px 5px",borderRadius:6,cursor:"pointer",minWidth:34,background:isPTO?"#fce7f3":"#eff6ff",border:`1px solid ${isPTO?"#ec4899":"#93c5fd"}`,color:isPTO?"#be185d":"#1d4ed8"}}>
              <span style={{fontSize:9,fontWeight:500}}>{dow}</span>
              <span style={{fontSize:12,fontWeight:700,lineHeight:1.3}}>{dt.getDate()}</span>
              <span style={{fontSize:8}}>{MONTHS[dt.getMonth()].slice(0,3)}</span>
            </div>
          );
        })}
      </div>
      <div style={{fontSize:10,color:"#aaa",marginTop:6}}>Pink = PTO · Blue = Remote · Tap to toggle</div>
    </div>
  );
}

// ── Flight Tracker ────────────────────────────────────────────
function FlightTracker({flights=[],onChange}){
  const [adding,setAdding]=useState(false);
  const [form,setForm]=useState(emptyFlight());
  const [scanning,setScanning]=useState(false);
  const [scanError,setScanError]=useState("");
  const [previews,setPreviews]=useState([]);
  const [pendingImages,setPendingImages]=useState([]);
  const [scanResults,setScanResults]=useState(null);
  const [selected,setSelected]=useState({});
  const [mode,setMode]=useState("upload");
  const fileRef=useRef();

  const bestCash=flights.filter(f=>f.cashPricePP||f.cashPriceTotal).sort((a,b)=>+(a.cashPricePP||a.cashPriceTotal)-+(b.cashPricePP||b.cashPriceTotal))[0];
  const bestMiles=flights.filter(f=>f.milesPrice).sort((a,b)=>+a.milesPrice-+b.milesPrice)[0];

  function reset(){setForm(emptyFlight());setPreviews([]);setPendingImages([]);setScanResults(null);setSelected({});setMode("upload");setScanError("");}

  async function handleScreenshot(e){
    const file=e.target.files[0];if(!file)return;fileRef.current.value="";
    setTimeout(async()=>{
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);});
        setPreviews(p=>[...p,dataUrl]);setPendingImages(p=>[...p,{base64Image:dataUrl.split(",")[1],mediaType:file.type}]);setScanError("");
      }catch{setScanError("Failed to load image.");}
    },50);
  }

  async function runScan(){
    if(!pendingImages.length)return;
    setScanning(true);setScanError("");
    try{
      const results=await scanFlightScreenshots(pendingImages);
      if(results&&results.length>0){
        const enriched=results.map(r=>({...r,cashPricePP:r.cashPriceTotal&&r.pax?String(Math.round(+r.cashPriceTotal/r.pax)):null,screenshots:previews}));
        setScanResults(enriched);
        const sel={};enriched.forEach((_,i)=>{sel[i]=true;});setSelected(sel);setMode("review");
      }else{setScanError("No options found — try manual entry.");setMode("manual");}
    }catch{setScanError("Scan failed — try manual entry.");setMode("manual");}
    setScanning(false);
  }

  function saveSelected(){
    const toSave=scanResults.filter((_,i)=>selected[i]);
    if(!toSave.length)return;
    onChange([...flights,...toSave.map(r=>({...emptyFlight(),...r,id:Date.now()+Math.random(),recordedAt:nowTs(),screenshots:previews}))]);
    reset();setAdding(false);
  }

  function saveManual(){
    if(!form.route)return;
    onChange([...flights,{...form,id:Date.now(),recordedAt:nowTs()}]);
    reset();setAdding(false);
  }

  function deleteEntry(id){onChange(flights.filter(f=>f.id!==id));}
  function removePreview(idx){setPreviews(p=>p.filter((_,i)=>i!==idx));setPendingImages(p=>p.filter((_,i)=>i!==idx));}
  function handlePaxChange(val){const n=+val;setForm(f=>{const total=f.cashPriceTotal?+f.cashPriceTotal:null,pp=f.cashPricePP?+f.cashPricePP:null;return{...f,pax:n,cashPricePP:total&&n?String(Math.round(total/n)):f.cashPricePP,cashPriceTotal:pp&&n?String(Math.round(pp*n)):f.cashPriceTotal};});}
  function handleTotalChange(val){setForm(f=>({...f,cashPriceTotal:val,cashPricePP:val&&f.pax?String(Math.round(+val/f.pax)):""}));}
  function handlePPChange(val){setForm(f=>({...f,cashPricePP:val,cashPriceTotal:val&&f.pax?String(Math.round(+val*f.pax)):""}));}

  const PriceTag=({f})=>(
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:5}}>
      {(f.cashPriceTotal||f.cashPricePP)&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:6,padding:"4px 10px"}}>
        {f.cashPriceTotal&&<span style={{fontSize:11,color:"#16a34a",fontWeight:700}}>{Number(f.cashPriceTotal).toLocaleString()} {f.cashCurrency}</span>}
        {f.cashPricePP&&<span style={{fontSize:11,color:"#16a34a"}}> · {Number(f.cashPricePP).toLocaleString()}/pp</span>}
        <span style={{fontSize:10,color:"#888",marginLeft:4}}>cash</span>
      </div>}
      {f.milesPrice&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"4px 10px",display:"flex",alignItems:"center",gap:5}}>
        <span style={{fontSize:11,color:"#2563eb",fontWeight:700}}>{Number(f.milesPrice).toLocaleString()} mi</span>
        {f.milesTaxTotal&&<><span style={{color:"#93c5fd"}}>+</span><span style={{fontSize:11,fontWeight:700,color:"#0369a1"}}>{Number(f.milesTaxTotal).toLocaleString()} {f.milesTaxCurrency||"AED"}</span><span style={{fontSize:10,color:"#888"}}>taxes</span></>}
        {f.milesProgram&&<span style={{fontSize:10,color:"#888"}}>· {f.milesProgram}</span>}
      </div>}
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:13,fontWeight:700}}>✈️ Flight options</span>
        <button onClick={()=>{if(adding){reset();setAdding(false);}else{reset();setAdding(true);}}} className="btn-secondary">{adding?"Cancel":"+ Add option"}</button>
      </div>

      {flights.length>1&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          {bestCash&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:"#16a34a",fontWeight:600,marginBottom:2}}>BEST CASH / PP</div>
            <div style={{fontSize:15,fontWeight:700,color:"#15803d"}}>{Number(bestCash.cashPricePP||bestCash.cashPriceTotal).toLocaleString()} {bestCash.cashCurrency}</div>
            <div style={{fontSize:10,color:"#666"}}>{bestCash.airline} · {bestCash.cabin}</div>
          </div>}
          {bestMiles&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:10,color:"#2563eb",fontWeight:600,marginBottom:2}}>BEST MILES</div>
            <div style={{fontSize:15,fontWeight:700,color:"#1d4ed8"}}>{Number(bestMiles.milesPrice).toLocaleString()} mi{bestMiles.milesTaxTotal&&<span style={{fontSize:13,fontWeight:600,color:"#0369a1"}}> + {Number(bestMiles.milesTaxTotal).toLocaleString()} {bestMiles.milesTaxCurrency||"AED"}</span>}</div>
            <div style={{fontSize:10,color:"#666"}}>{bestMiles.milesProgram} · {bestMiles.cabin}</div>
          </div>}
        </div>
      )}

      {adding&&(
        <div style={{background:"#fafafa",border:"1px solid #e5e5e5",borderRadius:10,padding:12,marginBottom:12}}>
          {mode==="upload"&&(
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:12,fontWeight:600,color:"#555"}}>Screenshots</span>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <input type="file" accept="image/*" ref={fileRef} style={{display:"none"}} onChange={handleScreenshot}/>
                  <button onClick={()=>fileRef.current.click()} className="btn-secondary" style={{fontSize:11,padding:"4px 10px"}}>📸 Add</button>
                  {pendingImages.length>0&&!scanning&&<button onClick={runScan} style={{padding:"4px 12px",borderRadius:8,border:"none",background:"#ec4899",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>✨ Scan {pendingImages.length}</button>}
                  {scanning&&<span style={{fontSize:11,color:"#f59e0b",display:"flex",alignItems:"center",gap:4}}><span className="spinner"/>Scanning…</span>}
                </div>
              </div>
              {scanError&&<div style={{color:"#ef4444",fontSize:11,marginBottom:8}}>{scanError}</div>}
              {previews.length===0?<div className="upload-zone" onClick={()=>fileRef.current.click()} style={{padding:14}}>
                <div style={{fontSize:22,marginBottom:4}}>📸</div>
                <div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:2}}>Upload flight screenshots</div>
                <div style={{fontSize:11,color:"#aaa"}}>Add all screenshots, then tap Scan</div>
              </div>:
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                {previews.map((src,i)=>(
                  <div key={i} style={{position:"relative",width:72,height:72}}>
                    <img src={src} style={{width:72,height:72,objectFit:"cover",borderRadius:6,border:"1px solid #e5e5e5"}} alt=""/>
                    <button onClick={()=>removePreview(i)} style={{position:"absolute",top:-4,right:-4,background:"#ef4444",border:"none",borderRadius:10,color:"#fff",width:18,height:18,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                  </div>
                ))}
              </div>}
              <button onClick={()=>setMode("manual")} style={{fontSize:11,color:"#aaa",background:"none",border:"none",cursor:"pointer",marginTop:4,textDecoration:"underline"}}>Skip — enter manually</button>
            </>
          )}

          {mode==="review"&&scanResults&&(
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:12,fontWeight:700}}>✨ Found {scanResults.length} option{scanResults.length>1?"s":""} — select to save</span>
                <button onClick={()=>setMode("upload")} style={{fontSize:11,color:"#aaa",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>← Back</button>
              </div>
              {scanResults.map((r,i)=>(
                <div key={i} style={{padding:"10px 12px",borderRadius:8,marginBottom:8,border:`1.5px solid ${selected[i]?"#ec4899":"#e5e5e5"}`,background:selected[i]?"#fff7fb":"#fff"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{flex:1,cursor:"pointer"}} onClick={()=>setSelected(s=>({...s,[i]:!s[i]}))}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:13}}>{r.route}</span>
                        <span style={{fontSize:10,padding:"1px 7px",borderRadius:20,background:r.cabin==="Business"||r.cabin==="First"?"#fef3c7":"#f0f0f0",color:r.cabin==="Business"||r.cabin==="First"?"#92400e":"#666",fontWeight:600}}>{r.cabin}</span>
                        {r.isRoundTrip&&<span style={{fontSize:10,padding:"1px 7px",borderRadius:20,background:"#eff6ff",color:"#2563eb"}}>round trip</span>}
                      </div>
                      <div style={{fontSize:11,color:"#666",marginBottom:4}}>{r.airline}</div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>
                        {r.cashPriceTotal&&<div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:6,padding:"3px 8px"}}>
                          <span style={{fontSize:12,fontWeight:700,color:"#16a34a"}}>{Number(r.cashPriceTotal).toLocaleString()} {r.cashCurrency}</span>
                          {r.cashPricePP&&<span style={{fontSize:11,color:"#16a34a"}}> · {Number(r.cashPricePP).toLocaleString()}/pp</span>}
                        </div>}
                        {r.milesPrice&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"3px 8px",display:"flex",alignItems:"center",gap:4}}>
                          <span style={{fontSize:12,fontWeight:700,color:"#2563eb"}}>{Number(r.milesPrice).toLocaleString()} mi</span>
                          {r.milesTaxTotal&&<><span style={{color:"#93c5fd"}}>+</span><span style={{fontSize:12,fontWeight:700,color:"#0369a1"}}>{Number(r.milesTaxTotal).toLocaleString()} {r.milesTaxCurrency||"AED"}</span><span style={{fontSize:10,color:"#888"}}>taxes</span></>}
                          {r.milesProgram&&<span style={{fontSize:10,color:"#888"}}>· {r.milesProgram}</span>}
                        </div>}
                      </div>
                      {(r.outboundDate||r.returnDate)&&<div style={{fontSize:10,color:"#888",marginBottom:4}}>✈ {r.outboundDate||""}{r.returnDate?` → ${r.returnDate}`:""} · {r.pax} pax</div>}
                    </div>
                    <div onClick={()=>setSelected(s=>({...s,[i]:!s[i]}))} style={{width:22,height:22,borderRadius:11,border:`2px solid ${selected[i]?"#ec4899":"#ddd"}`,background:selected[i]?"#ec4899":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginLeft:8,cursor:"pointer"}}>
                      {selected[i]&&<span style={{color:"#fff",fontSize:12,fontWeight:700}}>✓</span>}
                    </div>
                  </div>
                  <textarea value={r.notes||""} onChange={e=>{const u=[...scanResults];u[i]={...u[i],notes:e.target.value};setScanResults(u);}} onClick={e=>e.stopPropagation()} placeholder="Add notes…" rows={2}
                    style={{width:"100%",fontSize:10,color:"#666",fontStyle:"italic",background:"transparent",border:"1px solid #e5e5e5",borderRadius:5,padding:"4px 6px",resize:"vertical",marginTop:4,boxSizing:"border-box"}}/>
                </div>
              ))}
              <div style={{display:"flex",gap:8,marginTop:4}}>
                <button onClick={()=>{const s={};scanResults.forEach((_,i)=>{s[i]=true;});setSelected(s);}} style={{flex:1,padding:"7px",borderRadius:8,border:"1px solid #ddd",background:"#fff",color:"#666",fontSize:12,cursor:"pointer"}}>Select all</button>
                <button onClick={saveSelected} disabled={!Object.values(selected).some(Boolean)}
                  style={{flex:2,padding:"9px",borderRadius:8,border:"none",background:Object.values(selected).some(Boolean)?"#ec4899":"#e5e5e5",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                  Save {Object.values(selected).filter(Boolean).length} selected
                </button>
              </div>
            </>
          )}

          {mode==="manual"&&(
            <>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <span style={{fontSize:12,fontWeight:600,color:"#555"}}>Manual entry</span>
                <button onClick={()=>setMode("upload")} style={{fontSize:11,color:"#aaa",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>← Use screenshots</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Route *</label>
                  <input className="text-input" value={form.route} onChange={e=>setForm(f=>({...f,route:e.target.value}))} placeholder="AUH → DPS → AUH" style={{fontSize:13,padding:"7px 9px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Airline</label>
                  <input className="text-input" value={form.airline} onChange={e=>setForm(f=>({...f,airline:e.target.value}))} placeholder="Etihad EY476/477" style={{fontSize:13,padding:"7px 9px"}}/></div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Outbound</label>
                  <input type="date" className="date-input" value={form.outboundDate} onChange={e=>setForm(f=>({...f,outboundDate:e.target.value}))} style={{fontSize:12,padding:"7px 6px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Return</label>
                  <input type="date" className="date-input" value={form.returnDate} onChange={e=>setForm(f=>({...f,returnDate:e.target.value}))} style={{fontSize:12,padding:"7px 6px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Cabin</label>
                  <select className="select-input" value={form.cabin} onChange={e=>setForm(f=>({...f,cabin:e.target.value}))} style={{fontSize:12,padding:"7px 6px"}}>
                    {CABINS.map(c=><option key={c}>{c}</option>)}
                  </select></div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Total</label>
                  <input type="number" className="text-input" value={form.cashPriceTotal} onChange={e=>handleTotalChange(e.target.value)} placeholder="10060" style={{fontSize:13,padding:"7px 9px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Per person</label>
                  <input type="number" className="text-input" value={form.cashPricePP} onChange={e=>handlePPChange(e.target.value)} placeholder="5030" style={{fontSize:13,padding:"7px 9px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Pax / CCY</label>
                  <div style={{display:"flex",gap:4}}>
                    <input type="number" className="text-input" value={form.pax} onChange={e=>handlePaxChange(e.target.value)} min={1} max={9} style={{fontSize:13,padding:"7px 6px",width:44}}/>
                    <select className="select-input" value={form.cashCurrency} onChange={e=>setForm(f=>({...f,cashCurrency:e.target.value}))} style={{fontSize:12,padding:"7px 4px"}}>
                      {CURRENCIES.map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Miles</label>
                  <input type="number" className="text-input" value={form.milesPrice} onChange={e=>setForm(f=>({...f,milesPrice:e.target.value}))} placeholder="295708" style={{fontSize:13,padding:"7px 9px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>+ Taxes</label>
                  <input type="number" className="text-input" value={form.milesTaxTotal} onChange={e=>setForm(f=>({...f,milesTaxTotal:e.target.value}))} placeholder="1960" style={{fontSize:13,padding:"7px 9px"}}/></div>
                <div><label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Tax CCY</label>
                  <select className="select-input" value={form.milesTaxCurrency} onChange={e=>setForm(f=>({...f,milesTaxCurrency:e.target.value}))} style={{fontSize:12,padding:"7px 6px"}}>
                    {CURRENCIES.map(c=><option key={c}>{c}</option>)}
                  </select></div>
              </div>
              <div style={{marginBottom:8}}>
                <label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Miles program</label>
                <select className="select-input" value={form.milesProgram} onChange={e=>setForm(f=>({...f,milesProgram:e.target.value}))} style={{fontSize:13,padding:"7px 9px"}}>
                  {MILES_PROGRAMS.map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:11,color:"#888",display:"block",marginBottom:3}}>Notes</label>
                <textarea className="text-input" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="e.g. includes taxes, non-stop both ways" rows={3} style={{fontSize:13,padding:"7px 9px",resize:"vertical"}}/>
              </div>
              <button onClick={saveManual} disabled={!form.route}
                style={{width:"100%",padding:"9px",borderRadius:8,border:"none",background:form.route?"#ec4899":"#e5e5e5",color:"#fff",fontWeight:700,fontSize:13,cursor:form.route?"pointer":"default"}}>
                Save flight option
              </button>
            </>
          )}
        </div>
      )}

      {flights.length===0&&!adding&&<div style={{fontSize:12,color:"#aaa",textAlign:"center",padding:"12px 0"}}>No flight options yet — tap "+ Add option"</div>}

      {[...flights].reverse().map(f=>(
        <div key={f.id} className="flight-card">
          {f.screenshots?.length>0&&<div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap"}}>
            {f.screenshots.map((src,i)=><img key={i} src={src} style={{width:48,height:48,objectFit:"cover",borderRadius:5,border:"1px solid #e5e5e5"}} alt=""/>)}
          </div>}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
            <div style={{flex:1}}>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:2}}>
                <span style={{fontWeight:700,fontSize:14}}>{f.route}</span>
                <span style={{fontSize:10,padding:"1px 7px",borderRadius:20,background:f.cabin==="Business"||f.cabin==="First"?"#fef3c7":"#f0f0f0",color:f.cabin==="Business"||f.cabin==="First"?"#92400e":"#666",fontWeight:600}}>{f.cabin}</span>
                {f.isRoundTrip&&<span style={{fontSize:10,padding:"1px 7px",borderRadius:20,background:"#eff6ff",color:"#2563eb"}}>round trip</span>}
              </div>
              <div style={{fontSize:11,color:"#666"}}>{f.airline}</div>
            </div>
            <button onClick={()=>deleteEntry(f.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#ccc",fontSize:16,lineHeight:1,marginLeft:8}}>×</button>
          </div>
          <PriceTag f={f}/>
          {(f.outboundDate||f.returnDate)&&<div style={{fontSize:11,color:"#888",marginBottom:3}}>✈ {f.outboundDate||""}{f.returnDate?` → ${f.returnDate}`:""} · {f.pax||2} pax</div>}
          {f.notes&&<div style={{fontSize:11,color:"#666",fontStyle:"italic",marginBottom:3,whiteSpace:"pre-wrap"}}>"{f.notes}"</div>}
          <div style={{fontSize:10,color:"#bbb"}}>Recorded {fmtTs(f.recordedAt)}</div>
        </div>
      ))}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App(){
  const [unlocked,setUnlocked]=useState(!!sessionStorage.getItem(PIN_KEY));
  useEffect(()=>{if(unlocked&&window._fbAuth&&!window._fbAuth.currentUser)window._fbSignInAnonymously(window._fbAuth).catch(console.error);},[unlocked]);
  if(!unlocked)return<PinScreen onUnlock={()=>setUnlocked(true)}/>;
  return<Planner/>;
}

function Planner(){
  const [state,setState]=useState(null);
  const [synced,setSynced]=useState(false);
  const [year,setYear]=useState(2026);
  const [sheet,setSheet]=useState(null);
  const [editTrip,setEditTrip]=useState(null);
  const [pickerPerson,setPickerPerson]=useState("salma");
  const [whatIf,setWhatIf]=useState({month:"2026-07",days:5,who:"both"});
  const [activeTab,setActiveTab]=useState("details");
  const [tripCreateMode,setTripCreateMode]=useState(null); // null | "screenshot" | "manual"
  const [tripScanning,setTripScanning]=useState(false);
  const [tripScanError,setTripScanError]=useState("");
  const tripFileRef=useRef();
  const skipSave=useRef(false);

  useEffect(()=>{
    function init(){
      const r=window._fbRef(window._fbDb,"planner");
      window._fbOnValue(r,snap=>{
        const val=snap.val();skipSave.current=true;
        const s=val||DEFAULT;
        s.trips=(s.trips||[]).map(t=>({flights:[],...t}));
        s.scenarios=(s.scenarios||[]).map(t=>({flights:[],...t}));
        setState(s);setSynced(true);
        setTimeout(()=>{skipSave.current=false;},100);
      });
    }
    if(window._fbReady)init();
    else window.addEventListener("firebase-ready",init,{once:true});
  },[]);

  useEffect(()=>{
    if(!state||skipSave.current)return;
    const strip=trips=>trips.map(t=>({...t,flights:(t.flights||[]).map(f=>({...f,screenshots:[]}))}));
    const s={...state,trips:strip(state.trips),scenarios:strip(state.scenarios)};
    window._fbSet(window._fbRef(window._fbDb,"planner"),s).catch(console.error);
  },[state]);

  function save(s){setState(s);}
  if(!state)return<div style={{padding:32,textAlign:"center",color:"#888",fontSize:14}}>Loading…</div>;

  const all=[...state.trips,...state.scenarios];
  const sUsed=getDaysUsed(all,"salma",["committed"]),sPlanned=getDaysUsed(all,"salma",["planned"]);
  const aUsed=getDaysUsed(all,"adis",["committed"]),aPlanned=getDaysUsed(all,"adis",["planned"]);
  const sLeft=state.salma.total-sUsed,aLeft=state.adis.total-aUsed;
  const balCol=n=>n<=5?"#ef4444":n<=10?"#f59e0b":"#10b981";
  const pct=(u,t)=>Math.min(100,Math.round((u/t)*100));

  const [tripScanPreviews, setTripScanPreviews] = useState([]);
  const [tripPendingImages, setTripPendingImages] = useState([]);

  function openNew(){
    setEditTrip({id:Date.now(),name:"",who:"both",start:"",end:"",status:"planned",color:"#ec4899",ptoDays:null,flights:[],isNew:true});
    setPickerPerson("salma");setActiveTab("details");setTripCreateMode(null);setTripScanError("");
    setTripScanPreviews([]);setTripPendingImages([]);setSheet("trip");
  }
  function openEdit(t){setEditTrip({flights:[],...t});setPickerPerson(t.who==="adis"?"adis":"salma");setActiveTab("details");setTripCreateMode("manual");setSheet("trip");}

  async function handleTripScreenshot(e){
    const file=e.target.files[0];if(!file)return;tripFileRef.current.value="";
    setTimeout(async()=>{
      try{
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);});
        setTripScanPreviews(p=>[...p,dataUrl]);
        setTripPendingImages(p=>[...p,{base64Image:dataUrl.split(",")[1],mediaType:file.type}]);
        setTripScanError("");
      }catch{setTripScanError("Failed to load image.");}
    },50);
  }

  async function runTripScan(){
    if(!tripPendingImages.length)return;
    setTripScanning(true);setTripScanError("");
    try{
      const results=await scanFlightScreenshots(tripPendingImages);
      if(results&&results.length>0){
        const r=results[0];
        const dest=r.route?r.route.split(/->|→/).pop().trim():"";
        const pax=r.pax||2;
        const total=r.cashPriceTotal?String(r.cashPriceTotal):"";
        const flight={...emptyFlight(),id:Date.now(),route:r.route||"",airline:r.airline||"",outboundDate:r.outboundDate||"",returnDate:r.returnDate||"",cabin:CABINS.includes(r.cabin)?r.cabin:"Economy",cashPriceTotal:total,cashPricePP:total&&pax?String(Math.round(+total/pax)):"",cashCurrency:CURRENCIES.includes(r.cashCurrency)?r.cashCurrency:"AED",milesPrice:r.milesPrice?String(r.milesPrice):"",milesTaxTotal:r.milesTaxTotal?String(r.milesTaxTotal):"",milesTaxCurrency:r.milesTaxCurrency||"AED",milesProgram:r.milesProgram||"Etihad Guest",pax,isRoundTrip:r.isRoundTrip??true,notes:r.notes||"",recordedAt:nowTs(),screenshots:tripScanPreviews};
        setEditTrip(t=>({...t,name:dest||t.name,start:r.outboundDate||t.start,end:r.returnDate||r.outboundDate||t.end,flights:[flight]}));
        setTripCreateMode("manual");setActiveTab("details");
      }else{setTripScanError("Couldn't read screenshots — please fill manually.");}
    }catch{setTripScanError("Failed to process screenshots.");}
    setTripScanning(false);
  }

  function saveTrip(trip){
    const{isNew,...t}=trip;const isScen=t.status==="planned";
    const others=[...state.trips,...state.scenarios].filter(x=>x.id!==t.id);
    save({...state,trips:[...others.filter(x=>x.status==="committed"),...(isScen?[]:[t])],scenarios:[...others.filter(x=>x.status==="planned"),...(isScen?[t]:[])]});
    setSheet(null);
  }
  function deleteTrip(id){save({...state,trips:state.trips.filter(x=>x.id!==id),scenarios:state.scenarios.filter(x=>x.id!==id)});setSheet(null);}
  function updateFlights(tripId,flights){
    const upd=list=>list.map(t=>t.id===tripId?{...t,flights}:t);
    save({...state,trips:upd(state.trips),scenarios:upd(state.scenarios)});
    setEditTrip(t=>({...t,flights}));
  }

  function tripsForMonth(y,m){const s=new Date(y,m,1),e=new Date(y,m+1,0);return all.filter(t=>pDate(t.start)<=e&&pDate(t.end)>=s);}
  const pickerPeople=editTrip?.who==="both"?["salma","adis"]:editTrip?.who==="salma"?["salma"]:["adis"];
  const sWI=sLeft-(whatIf.who!=="adis"?whatIf.days:0),aWI=aLeft-(whatIf.who!=="salma"?whatIf.days:0);

  return(
    <div style={{maxWidth:520,margin:"0 auto",padding:"14px 12px 100px"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div>
          <h2 style={{fontSize:17,fontWeight:700,marginBottom:2}}>🗓 Holiday Planner</h2>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,color:"#888"}}>Salma & Adis · 2026–2027</span>
            <span className="sync-badge" style={{background:synced?"#f0fdf4":"#f5f5f5",color:synced?"#16a34a":"#888"}}>{synced?"● live":"○ connecting"}</span>
          </div>
        </div>
        <div style={{display:"flex",gap:5}}>
          {[2026,2027].map(y=>(<button key={y} onClick={()=>setYear(y)} style={{padding:"4px 10px",borderRadius:20,border:"1px solid #ddd",background:year===y?"#1a1a1a":"#fff",color:year===y?"#fff":"#1a1a1a",cursor:"pointer",fontSize:12,fontWeight:700}}>{y}</button>))}
        </div>
      </div>

      {/* Balances */}
      <div className="balance-grid">
        {[{name:"Salma",left:sLeft,used:sUsed,planned:sPlanned,total:state.salma.total,key:"salma"},{name:"Adis",left:aLeft,used:aUsed,planned:aPlanned,total:state.adis.total,key:"adis"}].map(p=>(
          <div key={p.key} className="balance-card">
            <div style={{fontSize:12,color:"#888",marginBottom:2}}>{p.name}</div>
            <div style={{fontSize:26,fontWeight:700,color:balCol(p.left),lineHeight:1.1}}>{p.left}</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:7}}>days left</div>
            <div style={{height:5,borderRadius:3,background:"#f0f0f0",overflow:"hidden",marginBottom:5}}>
              <div style={{height:"100%",borderRadius:3,background:"#ec4899",width:`${pct(p.used,p.total)}%`}}/>
            </div>
            <div style={{fontSize:10,color:"#888",display:"flex",justifyContent:"space-between"}}>
              <span><b style={{color:"#ec4899"}}>{p.used}</b> used</span>
              {p.planned>0&&<span><b style={{color:"#f59e0b"}}>{p.planned}</b> plan</span>}
              <span>{p.total} tot</span>
            </div>
          </div>
        ))}
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap",fontSize:10,color:"#888"}}>
        {[["#ec4899",2,"Committed"],["#f59e0b",2,"Planned"],["#10b981",8,"Hessen PH"],["#3b82f6",8,"Abu Dhabi PH"]].map(([c,r,l])=>(
          <span key={l} style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:9,height:9,borderRadius:r,background:c,display:"inline-block",flexShrink:0}}/>{l}</span>
        ))}
      </div>

      {/* Calendar */}
      <div className="cal-grid">
        {Array.from({length:12},(_,i)=>({y:year,m:i})).map(({y,m})=>{
          const trips=tripsForMonth(y,m);
          const dim=new Date(y,m+1,0).getDate();
          const fd=(new Date(y,m,1).getDay()+6)%7;
          const cells=Array(fd).fill(null).concat(Array.from({length:dim},(_,i)=>i+1));
          const today=new Date();
          return(
            <div key={`${y}-${m}`} className="month-card">
              <div style={{fontWeight:700,fontSize:11,marginBottom:5}}>{MONTHS[m]}</div>
              <div className="day-grid">
                {["M","T","W","T","F","S","S"].map((d,i)=><div key={i} style={{fontSize:7,color:"#bbb",paddingBottom:1}}>{d}</div>)}
                {cells.map((day,i)=>{
                  if(!day)return<div key={i}/>;
                  const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                  const isH=HESSEN_PH.has(ds),isA=AD_PH.has(ds);
                  const ton=trips.filter(t=>ds>=t.start&&ds<=t.end);
                  const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===day;
                  const col=i%7;const isWE=col===5||col===6;
                  let bg="transparent",fg=isWE?"#ccc":"#555",brd="none";
                  if(isH){bg="#10b981";fg="#fff";}if(isA){bg="#3b82f6";fg="#fff";}
                  if(ton.length){bg=ton[0].status==="committed"?ton[0].color:"#f59e0b";fg="#fff";}
                  if(isToday)brd="1.5px solid #1a1a1a";
                  const tip=[...ton.map(t=>t.name),...(PH_NAMES[ds]?[PH_NAMES[ds]]:[])];
                  return(
                    <div key={i} className="day-cell" title={tip.join(" · ")} onClick={ton.length?()=>openEdit(ton[0]):null}
                      style={{background:bg,color:fg,border:brd,cursor:ton.length?"pointer":"default",fontWeight:isToday?700:400}}>
                      {day}
                    </div>
                  );
                })}
              </div>
              {trips.length>0&&<div style={{marginTop:4,display:"flex",flexDirection:"column",gap:2}}>
                {trips.map(t=>(
                  <div key={t.id} onClick={()=>openEdit(t)} style={{fontSize:8,padding:"2px 4px",borderRadius:3,background:t.color+"18",color:t.color,cursor:"pointer",border:`1px solid ${t.color}33`,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {t.who==="both"?"👫":t.who==="salma"?"S":"A"} {t.name}{t.flights?.length>0&&<span style={{marginLeft:4}}>✈{t.flights.length}</span>}
                  </div>
                ))}
              </div>}
            </div>
          );
        })}
      </div>

      {/* FABs */}
      <div className="fab-wrap">
        <button className="fab" onClick={()=>setSheet(s=>s==="whatif"?null:"whatif")} style={{width:46,height:46,borderRadius:23,background:"#f59e0b",color:"#fff",fontSize:18,fontWeight:700}}>?</button>
        <button className="fab" onClick={openNew} style={{width:56,height:56,borderRadius:28,background:"#ec4899",color:"#fff",fontSize:26}}>+</button>
      </div>

      {/* Trip sheet */}
      <BottomSheet open={sheet==="trip"} onClose={()=>{setSheet(null);setTripCreateMode(null);setTripScanError("");setTripScanPreviews([]);setTripPendingImages([]);}} title={editTrip?.isNew?"New trip":editTrip?.name||"Edit trip"}>
        {editTrip&&(
          <>
            {/* Mode picker — only for new trips */}
            {editTrip.isNew&&tripCreateMode===null&&(
              <div>
                <p style={{fontSize:13,color:"#888",marginBottom:14,textAlign:"center"}}>How would you like to add this trip?</p>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:0}}>
                  <div className="mode-card" onClick={()=>setTripCreateMode("screenshot")}>
                    <div style={{fontSize:28,marginBottom:8}}>📸</div>
                    <div style={{fontSize:13,fontWeight:700,color:"#1a1a1a",marginBottom:4}}>From screenshot</div>
                    <div style={{fontSize:11,color:"#888"}}>Upload a flight search screenshot — Claude fills dates, destination & first price entry</div>
                  </div>
                  <div className="mode-card" onClick={()=>setTripCreateMode("manual")}>
                    <div style={{fontSize:28,marginBottom:8}}>✏️</div>
                    <div style={{fontSize:13,fontWeight:700,color:"#1a1a1a",marginBottom:4}}>Manual entry</div>
                    <div style={{fontSize:11,color:"#888"}}>Fill in trip name, dates and details yourself</div>
                  </div>
                </div>
              </div>
            )}

            {/* Screenshot upload for new trip */}
            {editTrip.isNew&&tripCreateMode==="screenshot"&&(
              <div>
                <input type="file" accept="image/*" ref={tripFileRef} style={{display:"none"}} onChange={handleTripScreenshot}/>
                {tripScanning?(
                  <div style={{textAlign:"center",padding:"32px 0",color:"#f59e0b"}}>
                    <span className="spinner"/><span style={{fontSize:14,marginLeft:8}}>Reading screenshots…</span>
                  </div>
                ):(
                  <>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                      <span style={{fontSize:13,fontWeight:600,color:"#555"}}>Add screenshots</span>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>tripFileRef.current.click()} className="btn-secondary" style={{fontSize:12,padding:"5px 12px"}}>📸 Add</button>
                        {tripPendingImages.length>0&&(
                          <button onClick={runTripScan} style={{padding:"5px 14px",borderRadius:8,border:"none",background:"#ec4899",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>
                            ✨ Scan {tripPendingImages.length}
                          </button>
                        )}
                      </div>
                    </div>
                    {tripScanError&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10}}>{tripScanError}</div>}
                    {tripScanPreviews.length===0?(
                      <div className="upload-zone" onClick={()=>tripFileRef.current.click()} style={{padding:24,marginBottom:12}}>
                        <div style={{fontSize:32,marginBottom:8}}>📸</div>
                        <div style={{fontSize:14,fontWeight:700,color:"#1a1a1a",marginBottom:4}}>Upload flight screenshots</div>
                        <div style={{fontSize:12,color:"#888"}}>Add outbound + return screenshots, then tap Scan</div>
                      </div>
                    ):(
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                        {tripScanPreviews.map((src,i)=>(
                          <div key={i} style={{position:"relative",width:80,height:80}}>
                            <img src={src} style={{width:80,height:80,objectFit:"cover",borderRadius:8,border:"1px solid #e5e5e5"}} alt=""/>
                            <button onClick={()=>{setTripScanPreviews(p=>p.filter((_,j)=>j!==i));setTripPendingImages(p=>p.filter((_,j)=>j!==i));}}
                              style={{position:"absolute",top:-4,right:-4,background:"#ef4444",border:"none",borderRadius:10,color:"#fff",width:20,height:20,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
                          </div>
                        ))}
                        <div onClick={()=>tripFileRef.current.click()} style={{width:80,height:80,borderRadius:8,border:"2px dashed #e5e5e5",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#aaa",fontSize:24}}>+</div>
                      </div>
                    )}
                    <button onClick={()=>setTripCreateMode("manual")} style={{width:"100%",padding:"9px",borderRadius:8,border:"1px solid #ddd",background:"transparent",color:"#888",fontSize:13,cursor:"pointer"}}>
                      ✏️ Fill in manually instead
                    </button>
                  </>
                )}
              </div>
            )}

            {/* Trip form */}
            {(!editTrip.isNew||tripCreateMode==="manual")&&(
              <>
                <div style={{display:"flex",gap:0,marginBottom:16,borderBottom:"1px solid #e5e5e5"}}>
                  {[["details","Details"],["flights",`Flights${editTrip.flights?.length>0?` (${editTrip.flights.length})`:""}`]].map(([t,l])=>(
                    <button key={t} onClick={()=>setActiveTab(t)}
                      style={{flex:1,padding:"8px 4px",border:"none",background:"transparent",color:activeTab===t?"#ec4899":"#aaa",fontWeight:activeTab===t?700:400,fontSize:13,cursor:"pointer",borderBottom:activeTab===t?"2px solid #ec4899":"2px solid transparent",marginBottom:-1}}>
                      {l}
                    </button>
                  ))}
                </div>

                {activeTab==="details"&&(
                  <>
                    <div className="field"><label>Trip name</label>
                      <input className="text-input" value={editTrip.name} onChange={e=>setEditTrip(t=>({...t,name:e.target.value}))} placeholder="e.g. Bali, Japan, Euro Summer…"/></div>
                    <div className="field"><label>Who's going?</label>
                      <ToggleGroup options={[["both","👫 Both"],["salma","Salma"],["adis","Adis"]]} value={editTrip.who}
                        onChange={v=>{setEditTrip(t=>({...t,who:v,ptoDays:null}));setPickerPerson(v==="adis"?"adis":"salma");}}/></div>
                    <div className="field"><label>Status</label>
                      <ToggleGroup options={[["committed","✓ Committed"],["planned","~ Planned"]]} value={editTrip.status}
                        onChange={v=>setEditTrip(t=>({...t,status:v}))} accent={editTrip.status==="committed"?"#ec4899":"#f59e0b"}/></div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                      <div className="field" style={{marginBottom:0}}><label>Start</label>
                        <input type="date" className="date-input" value={editTrip.start} onChange={e=>setEditTrip(t=>({...t,start:e.target.value,ptoDays:null}))}/></div>
                      <div className="field" style={{marginBottom:0}}><label>End</label>
                        <input type="date" className="date-input" value={editTrip.end} onChange={e=>setEditTrip(t=>({...t,end:e.target.value,ptoDays:null}))}/></div>
                    </div>
                    {editTrip.start&&editTrip.end&&editTrip.start<=editTrip.end&&(
                      <div className="field"><label>PTO vs Remote days</label>
                        <div style={{background:"#fafafa",borderRadius:8,padding:10,border:"1px solid #e5e5e5"}}>
                          {pickerPeople.length>1&&(
                            <div style={{display:"flex",gap:6,marginBottom:10}}>
                              {pickerPeople.map(p=>(
                                <button key={p} onClick={()=>setPickerPerson(p)} style={{padding:"4px 14px",borderRadius:20,border:`1px solid ${pickerPerson===p?"#ec4899":"#ddd"}`,background:pickerPerson===p?"#fce7f3":"#fff",color:pickerPerson===p?"#be185d":"#888",cursor:"pointer",fontSize:12,fontWeight:pickerPerson===p?700:400,textTransform:"capitalize"}}>
                                  {p}
                                </button>
                              ))}
                            </div>
                          )}
                          <DayPicker trip={editTrip} person={pickerPerson} onChange={setEditTrip}/>
                        </div>
                      </div>
                    )}
                    <div className="field"><label>Color</label>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                        {COLORS.map(c=><div key={c} onClick={()=>setEditTrip(t=>({...t,color:c}))} style={{width:28,height:28,borderRadius:14,background:c,cursor:"pointer",border:editTrip.color===c?"3px solid #1a1a1a":"3px solid transparent"}}/>)}
                      </div>
                    </div>
                    <button className="btn-primary" onClick={()=>saveTrip(editTrip)} disabled={!editTrip.name||!editTrip.start||!editTrip.end||editTrip.start>editTrip.end}
                      style={{background:(editTrip.name&&editTrip.start&&editTrip.end&&editTrip.start<=editTrip.end)?"#ec4899":"#e5e5e5"}}>
                      {editTrip.isNew?"Add trip":"Save changes"}
                    </button>
                    {!editTrip.isNew&&<button className="btn-danger" onClick={()=>deleteTrip(editTrip.id)}>Delete trip</button>}
                  </>
                )}

                {activeTab==="flights"&&(
                  <FlightTracker flights={editTrip.flights||[]}
                    onChange={flights=>{setEditTrip(t=>({...t,flights}));if(!editTrip.isNew)updateFlights(editTrip.id,flights);}}/>
                )}
              </>
            )}
          </>
        )}
      </BottomSheet>

      {/* What-if sheet */}
      <BottomSheet open={sheet==="whatif"} onClose={()=>setSheet(null)} title="What-if scenario">
        <div className="field"><label>Month</label>
          <select className="select-input" value={whatIf.month} onChange={e=>setWhatIf(w=>({...w,month:e.target.value}))}>
            {[2026,2027].flatMap(y=>Array.from({length:12},(_,i)=>{const v=`${y}-${String(i+1).padStart(2,"0")}`;return<option key={v} value={v}>{MONTHS[i]} {y}</option>;}))}
          </select></div>
        <div className="field"><label>Who</label>
          <ToggleGroup options={[["both","👫 Both"],["salma","Salma"],["adis","Adis"]]} value={whatIf.who} onChange={v=>setWhatIf(w=>({...w,who:v}))} accent="#f59e0b"/></div>
        <div className="field"><label>PTO days: <b style={{fontSize:15}}>{whatIf.days}</b></label>
          <input type="range" min={1} max={30} value={whatIf.days} onChange={e=>setWhatIf(w=>({...w,days:+e.target.value}))} style={{width:"100%",accentColor:"#f59e0b",height:24}}/></div>
        <div style={{background:"#fafafa",borderRadius:10,padding:14,border:"1px solid #e5e5e5",marginBottom:16}}>
          {whatIf.who!=="adis"&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:13}}><span style={{color:"#888"}}>Salma</span><span><b>{sLeft}</b> → <b style={{color:sWI<0?"#ef4444":"#10b981",fontSize:15}}>{sWI}</b> days left</span></div>}
          {whatIf.who!=="salma"&&<div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span style={{color:"#888"}}>Adis</span><span><b>{aLeft}</b> → <b style={{color:aWI<0?"#ef4444":"#10b981",fontSize:15}}>{aWI}</b> days left</span></div>}
        </div>
        <button className="btn-primary" onClick={()=>{
          const[y,m]=whatIf.month.split("-").map(Number);
          const s=fmtD(new Date(y,m-1,1)),e=fmtD(new Date(y,m-1,whatIf.days));
          saveTrip({id:Date.now(),name:`Scenario ${MONTHS[m-1]}`,who:whatIf.who,start:s,end:e,status:"planned",color:"#f59e0b",ptoDays:null,flights:[],isNew:true});
          setSheet(null);
        }} style={{background:"#f59e0b"}}>Add to calendar as planned</button>
      </BottomSheet>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
